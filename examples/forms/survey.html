<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire — SC Storage</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .survey { min-height: 100vh; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; gap: 16px; padding: 18px clamp(16px, 4vw, 40px); }
    .top .brand { display: flex; align-items: center; gap: 8px; font: 700 15px var(--font-sans); color: var(--text-primary); text-decoration: none; } .top .brand img { width: 26px; }
    .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--hover-bg); overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width .4s var(--ease); }
    .count { font: 600 13px var(--font-sans); color: var(--text-muted); font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) { .top .brand span { display: none; } }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px clamp(16px, 6vw, 64px) 80px; }
    .q { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 18px; animation: rise .35s var(--ease); }
    .q h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
    .q .hint { margin: -8px 0 4px; font-size: 16px; color: var(--text-secondary); line-height: 1.5; }
    .q.done { align-items: center; text-align: center; } .q.done .nav { justify-content: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .qnum { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--primary); } .qnum .mi { font-size: 16px; }
    .big-emoji { font-size: 56px; line-height: 1; }
    .nps { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 6px; }
    .nps button { aspect-ratio: 1; max-height: 56px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card-bg); font: 700 16px var(--font-sans); color: var(--text-primary); cursor: pointer; transition: transform .1s; }
    .nps button:hover { transform: translateY(-2px); border-color: var(--text-muted); }
    .nps button.on.det { background: var(--error); border-color: var(--error); color: #fff; }
    .nps button.on.pas { background: var(--warning); border-color: var(--warning); color: #1f2937; }
    .nps button.on.pro { background: var(--success); border-color: var(--success); color: #fff; }
    @media (max-width: 600px) { .nps { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    .nps-legend { display: flex; justify-content: space-between; margin-top: -8px; font-size: 12.5px; color: var(--text-muted); }
    .ratings { display: flex; flex-direction: column; gap: 4px; }
    .r-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--card-bg); border: 1px solid var(--border); font-size: 15px; font-weight: 500; flex-wrap: wrap; }
    .stars { display: inline-flex; } .stars button { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--border); }
    .stars button .mi { font-size: 32px; } .stars button.on { color: #f59e0b; } .stars:hover button { color: #f59e0b; } .stars button:hover ~ button { color: var(--border); }
    .opts { display: flex; flex-direction: column; gap: 8px; max-width: 460px; }
    .opt { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px 0 10px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card-bg); font: 500 15px var(--font-sans); color: var(--text-primary); cursor: pointer; text-align: left; }
    .opt kbd { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; border: 1px solid var(--border); font: 700 12px var(--font-sans); color: var(--text-secondary); }
    .opt .mi { color: var(--text-secondary); } .opt .tick { margin-left: auto; color: var(--primary); }
    .opt:hover { border-color: var(--primary); }
    .opt.on { border-color: var(--primary); background: var(--primary-soft); } .opt.on kbd { background: var(--primary); border-color: var(--primary); color: var(--on-primary); } .opt.on .mi { color: var(--primary); }
    .field-box.big textarea { font-size: 16px; }
    .nav { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; } .nav .ui-btn { height: 46px; }
    .kbd-hint { font-size: 12.5px; color: var(--text-muted); }
    .kbd-hint kbd { font: 600 11px var(--font-sans); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--card-bg); }
    @media (max-width: 767px) { .kbd-hint { display: none; } }
    .arrows { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: var(--card-bg); box-shadow: var(--shadow-2); }
  </style>
</head>
<body>
  <div class="survey">
    <header class="top">
      <a href="../app/modules.html" class="brand"><img src="../../assets/logo.png" alt=""><span>SC Storage</span></a>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><span></span></div>
      <span class="count" id="count"></span>
    </header>
    <main class="stage" id="stage"></main>
    <footer class="arrows" id="arrows">
      <button class="ui-btn ui-btn--icon" data-act="prev" aria-label="Question précédente"><span class="mi">keyboard_arrow_up</span></button>
      <button class="ui-btn ui-btn--icon" data-act="next" aria-label="Question suivante"><span class="mi">keyboard_arrow_down</span></button>
    </footer>
  </div>

  <script>
  (function () {
    var Q = [
      { id: 'nps', kind: 'nps', title: 'Recommanderiez-vous SC Storage à un collègue ?', hint: 'De 0 (pas du tout) à 10 (sans hésiter).' },
      { id: 'use', kind: 'single', title: 'À quelle fréquence utilisez-vous l\'application ?', options: [
        { label: 'Plusieurs fois par jour', icon: 'bolt' }, { label: 'Tous les jours', icon: 'today' }, { label: 'Chaque semaine', icon: 'date_range' }, { label: 'Rarement', icon: 'hourglass_empty' }] },
      { id: 'rate', kind: 'rating', title: 'Comment évaluez-vous ces aspects ?', hint: 'Une étoile = très insatisfait, cinq = très satisfait.', items: ['Rapidité', 'Facilité d\'utilisation', 'Application mobile', 'Support client'] },
      { id: 'features', kind: 'multi', title: 'Quelles fonctionnalités aimeriez-vous voir arriver ?', hint: 'Plusieurs réponses possibles.', options: [
        { label: 'Mode hors ligne', icon: 'cloud_off' }, { label: 'Signature électronique', icon: 'draw' }, { label: 'Paiement Mobile Money intégré', icon: 'phone_iphone' }, { label: 'Rapports personnalisés', icon: 'insights' }, { label: 'API publique', icon: 'api' }] },
      { id: 'free', kind: 'text', title: 'Un dernier mot pour l\'équipe ?', placeholder: 'Ce qui vous plaît, ce qui vous agace, vos idées…' }
    ];
    var L = 'ABCDEFGH', i = 0, finished = false, a = {}, stage = document.getElementById('stage');

    function answered() {
      var q = Q[i];
      if (q.kind === 'rating') return q.items.some(function (it) { return a[q.id + ':' + it]; });
      if (q.kind === 'multi') return (a[q.id] || []).length > 0;
      if (q.kind === 'text') return !!(a[q.id] || '').trim();
      return a[q.id] !== undefined;
    }
    function has(id, v) { return (a[id] || []).indexOf(v) >= 0; }

    function render() {
      var p = ((i + (finished ? 1 : 0)) / Q.length) * 100;
      var bar = document.getElementById('bar'); bar.firstChild.style.width = p + '%'; bar.setAttribute('aria-valuenow', Math.round(p));
      document.getElementById('count').textContent = Math.min(i + 1, Q.length) + ' / ' + Q.length;
      document.getElementById('arrows').hidden = finished;
      if (finished) {
        stage.innerHTML = '<div class="q done"><span class="big-emoji" aria-hidden="true">🙏</span><h1>Merci pour vos réponses !</h1>' +
          '<p class="hint">Vos retours arrivent directement à l\'équipe produit. Score NPS donné : <strong>' + (a.nps !== undefined ? a.nps : '–') + '</strong>.</p>' +
          '<div class="nav"><button class="ui-btn ui-btn--outlined" data-act="restart"><span class="mi">replay</span>Recommencer</button><a class="ui-btn" href="../app/dashboard.html">Retour à l\'application</a></div></div>';
        return;
      }
      var q = Q[i], body = '';
      if (q.kind === 'nps') body = '<div class="nps" role="radiogroup" aria-label="' + q.title + '">' + Array.from({ length: 11 }, function (_, n) {
          return '<button type="button" role="radio" aria-checked="' + (a.nps === n) + '" class="' + (a.nps === n ? 'on ' : '') + (n <= 6 ? 'det' : n <= 8 ? 'pas' : 'pro') + '" data-pick="nps" data-v="' + n + '">' + n + '</button>'; }).join('') +
        '</div><div class="nps-legend"><span>Pas du tout probable</span><span>Très probable</span></div>';
      else if (q.kind === 'rating') body = '<div class="ratings">' + q.items.map(function (it) {
          var k = q.id + ':' + it, v = a[k] || 0;
          return '<div class="r-row"><span>' + it + '</span><span class="stars" role="radiogroup" aria-label="' + it + '">' + [1, 2, 3, 4, 5].map(function (s) {
            return '<button type="button" role="radio" aria-checked="' + (v === s) + '" aria-label="' + s + ' étoile' + (s > 1 ? 's' : '') + '" class="' + (s <= v ? 'on' : '') + '" data-rate="' + k + '" data-v="' + s + '"><span class="mi">' + (s <= v ? 'star' : 'star_outline') + '</span></button>'; }).join('') + '</span></div>';
        }).join('') + '</div>';
      else if (q.kind === 'single' || q.kind === 'multi') body = '<div class="opts">' + q.options.map(function (o, k) {
          var on = q.kind === 'single' ? a[q.id] === o.label : has(q.id, o.label);
          return '<button type="button" class="opt' + (on ? ' on' : '') + '" ' + (q.kind === 'single' ? 'data-pick="' + q.id + '"' : 'data-toggle="' + q.id + '" aria-pressed="' + on + '"') + ' data-v="' + o.label + '">' +
            '<kbd>' + L[k] + '</kbd><span class="mi">' + o.icon + '</span>' + o.label + (q.kind === 'multi' && on ? '<span class="mi tick">check</span>' : '') + '</button>'; }).join('') + '</div>';
      else body = '<div class="field-box textarea-box big"><textarea rows="4" id="free" placeholder="' + q.placeholder + '">' + (a[q.id] || '') + '</textarea></div>';
      stage.innerHTML = '<div class="q"><span class="qnum">Question ' + (i + 1) + '<span class="mi">arrow_forward</span></span><h1>' + q.title + '</h1>' + (q.hint ? '<p class="hint">' + q.hint + '</p>' : '') + body +
        '<div class="nav"><button class="ui-btn" data-act="next"' + (answered() ? '' : ' disabled') + '>' + (i === Q.length - 1 ? 'Envoyer' : 'Valider') + '<span class="mi">check</span></button>' +
        '<span class="kbd-hint">ou appuyez sur <kbd>Entrée ↵</kbd></span>' + (q.kind === 'text' || q.kind === 'multi' ? '<button class="ui-btn ui-btn--text" data-act="skip">Passer</button>' : '') + '</div></div>';
      var nx = document.querySelector('.arrows [data-act=next]'); nx.disabled = !answered();
      document.querySelector('.arrows [data-act=prev]').disabled = i === 0;
    }
    function next(skip) { if (!skip && !answered()) return; if (i < Q.length - 1) i++; else finished = true; render(); }
    function pick(id, v) { a[id] = v; render(); setTimeout(function () { next(); }, 280); }
    function toggle(id, v) { var l = a[id] || []; a[id] = l.indexOf(v) >= 0 ? l.filter(function (x) { return x !== v; }) : l.concat(v); render(); }

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-pick],[data-toggle],[data-rate],[data-act]');
      if (!t) return;
      if (t.dataset.pick) return pick(t.dataset.pick, t.dataset.pick === 'nps' ? +t.dataset.v : t.dataset.v);
      if (t.dataset.toggle) return toggle(t.dataset.toggle, t.dataset.v);
      if (t.dataset.rate) { a[t.dataset.rate] = +t.dataset.v; return render(); }
      var act = t.dataset.act;
      if (act === 'next') next(); else if (act === 'skip') next(true);
      else if (act === 'prev') { i = Math.max(0, i - 1); render(); }
      else if (act === 'restart') { a = {}; i = 0; finished = false; render(); }
    });
    stage.addEventListener('input', function (e) { if (e.target.id === 'free') { a.free = e.target.value; document.querySelector('.nav [data-act=next]').disabled = !answered(); document.querySelector('.arrows [data-act=next]').disabled = !answered(); } });
    // Entrée valide, ↑ ↓ naviguent, A–H choisissent une option, 0–9 pour le NPS
    window.addEventListener('keydown', function (e) {
      if (finished || e.target.closest('textarea, input')) return;
      var q = Q[i];
      if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); return next(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); i = Math.max(0, i - 1); return render(); }
      var k = L.indexOf(e.key.toUpperCase());
      if ((q.kind === 'single' || q.kind === 'multi') && k >= 0 && k < q.options.length) q.kind === 'single' ? pick(q.id, q.options[k].label) : toggle(q.id, q.options[k].label);
      if (q.kind === 'nps' && /^\d$/.test(e.key)) pick('nps', +e.key);
    });
    render();
  })();
  </script>
</body>
</html>

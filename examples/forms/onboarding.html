<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue — SC Storage</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .wizard { display: grid; grid-template-columns: 360px minmax(0, 1fr); min-height: 100vh; }
    .rail { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-10) var(--space-8); color: #fff;
      background: linear-gradient(165deg, color-mix(in srgb, var(--primary) 80%, #0b1220), color-mix(in srgb, var(--tertiary) 55%, #0b1220)); }
    .rail .brand { display: flex; align-items: center; gap: var(--space-3); color: #fff; text-decoration: none; } .rail .brand img { width: 32px; } .rail .brand span { font-size: 18px; font-weight: 700; }
    .intro h2 { margin: 0 0 var(--space-2); font-size: 26px; font-weight: 700; line-height: 1.15; color: #fff; } .intro p { margin: 0; line-height: 1.55; opacity: .8; }
    .help-line { margin: auto 0 0; display: flex; align-items: center; gap: var(--space-2); font-size: 13px; opacity: .85; } .help-line a { color: #fff; font-weight: 600; }
    .vsteps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
    .vsteps li { position: relative; padding-bottom: var(--space-6); }
    .vsteps li:not(:last-child)::before { content: ''; position: absolute; left: 19px; top: 44px; bottom: 4px; width: 2px; background: rgba(255,255,255,.2); }
    .vsteps li.done:not(:last-child)::before { background: #fff; }
    .vsteps button { display: flex; align-items: center; gap: var(--space-4); width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
    .vsteps button:disabled { cursor: default; }
    .vsteps .dot { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.35); }
    .vsteps .dot .mi { font-size: 19px; }
    .vsteps .txt { display: flex; flex-direction: column; } .vsteps .txt small { font-size: 12.5px; opacity: .7; }
    .vsteps li:not(.on):not(.done) { opacity: .6; }
    .vsteps .on .dot { background: #fff; color: var(--primary); border-color: #fff; box-shadow: 0 0 0 5px rgba(255,255,255,.18); }
    .vsteps .done .dot { background: rgba(255,255,255,.2); border-color: transparent; }
    .stage { display: flex; flex-direction: column; padding: var(--space-8) clamp(16px, 6vw, 80px) var(--space-10); }
    .mobile-progress { display: none; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-8); }
    .top .count { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .top .skip { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); text-decoration: none; } .top .skip:hover { color: var(--primary); }
    .pane { width: 100%; max-width: 640px; margin: auto; display: flex; flex-direction: column; gap: var(--space-5); animation: in .3s ease; }
    .pane h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .lead { margin: -10px 0 var(--space-1); font-size: 16px; line-height: 1.55; color: var(--text-secondary); max-width: 52ch; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    .profile { display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; }
    .profile .avatar { width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 28px var(--font-sans); transition: background .2s; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--card-bg); outline: 1px solid var(--border); cursor: pointer; }
    .swatches button[aria-pressed="true"] { outline: 2px solid var(--text-primary); }
    .field-box.big { min-height: 54px; } .field-box.big input { font-size: 17px; }
    .seg { display: flex; flex-wrap: wrap; padding: var(--space-1); gap: 2px; border-radius: var(--radius-lg); background: var(--hover-bg); width: fit-content; max-width: 100%; }
    .seg button { height: 38px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-md); background: none; font: 600 13.5px var(--font-sans); color: var(--text-secondary); cursor: pointer; }
    .seg button.on { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-1); }
    .mods { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 48px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-input); background: var(--card-bg); }
    .tags:focus-within { border-color: var(--primary); box-shadow: var(--focus-ring); }
    .tags .tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 500; }
    .tags .tag button { border: 0; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; padding: 0; } .tags .tag .mi { font-size: 16px; }
    .tags input { flex: 1; min-width: 160px; border: 0; outline: 0; background: none; font: 14px var(--font-sans); color: var(--text-primary); height: 32px; }
    .sugg { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--text-muted); }
    .share { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4); border: 1px dashed var(--border); }
    .share > .mi { color: var(--primary); } .share span { flex: 1; display: flex; flex-direction: column; } .share small { font: 12.5px var(--font-mono); color: var(--text-muted); }
    .nav { margin-top: var(--space-2); padding-top: var(--space-5); border-top: 1px solid var(--border); }
    @media (max-width: 1100px) {
      .wizard { grid-template-columns: minmax(0, 1fr); } .rail { display: none; }
      .mobile-progress { display: block; height: 4px; margin: -32px calc(-1 * clamp(16px, 6vw, 80px)) var(--space-5); background: var(--hover-bg); }
      .mobile-progress span { display: block; height: 100%; background: var(--primary); transition: width .3s; }
    }
  </style>
</head>
<body>
  <div class="wizard">
    <aside class="rail">
      <a class="brand" href="../app/modules.html"><img src="../../assets/logo-white.png" alt=""><span>SC Storage</span></a>
      <div class="intro"><h2>Configurons votre espace</h2><p>Quatre étapes, environ deux minutes. Vous pourrez tout modifier plus tard.</p></div>
      <ol class="vsteps" id="vsteps"></ol>
      <p class="help-line"><span class="mi">support_agent</span>Besoin d'aide ? <a href="#" onclick="return false">Parler à un conseiller</a></p>
    </aside>
    <main class="stage">
      <div class="mobile-progress"><span id="progress"></span></div>
      <div class="top"><span class="count" id="count"></span><a href="../app/modules.html" class="skip">Passer pour l'instant</a></div>
      <div class="pane" id="pane"></div>
    </main>
  </div>

  <script src="../../js/data/examples.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script>
  (function () {
    var STEPS = [
      { label: 'Votre profil', hint: 'Nom, rôle, photo', icon: 'person' },
      { label: 'Votre organisation', hint: 'Secteur et taille', icon: 'business' },
      { label: 'Vos modules', hint: 'Ce que vous allez utiliser', icon: 'apps' },
      { label: 'Votre équipe', hint: 'Invitez vos collègues', icon: 'group_add' }
    ];
    var ROLES = ['Direction', 'Opérations', 'Finance', 'Commercial', 'Technique', 'Autre'];
    var SECTORS = [
      { id: 'transport', label: 'Transport & logistique', icon: 'local_shipping' }, { id: 'agro', label: 'Agro-industrie', icon: 'agriculture' },
      { id: 'retail', label: 'Commerce & distribution', icon: 'storefront' }, { id: 'services', label: 'Services', icon: 'handshake' },
      { id: 'health', label: 'Santé', icon: 'local_hospital' }, { id: 'other', label: 'Autre', icon: 'more_horiz' }];
    var SIZES = ['1 – 10', '11 – 50', '51 – 200', '201 – 1 000', '1 000 +'];
    var COLORS = ['#0ea5e9', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#334155'];
    var MODULES = DATA.EX_MODULES.slice(0, 8);
    var SUGG = ['aya.kone@sotra.ci', 'marc.yao@exemple.ci', 'grace@digitalbaobab.ci'];
    var isMail = function (t) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t); };
    var S = { step: 0, done: false, error: '', tagError: '',
      m: { first: 'Jean', last: 'Kouassi', role: 'Direction', color: '#0ea5e9', company: '', sector: 'transport', size: '11 – 50', modules: ['crm', 'billing'], invites: [], inviteRole: 'Membre' } };
    var pane = document.getElementById('pane');
    function initials() { return ((S.m.first[0] || '') + (S.m.last[0] || '')).toUpperCase() || '?'; }

    function rail() {
      document.getElementById('vsteps').innerHTML = STEPS.map(function (s, i) {
        var done = i < S.step || S.done, on = i === S.step && !S.done;
        return '<li class="' + (on ? 'on' : done ? 'done' : '') + '"><button type="button" data-go="' + i + '"' + (i >= S.step ? ' disabled' : '') + '>' +
          '<span class="dot"><span class="mi">' + (done ? 'check' : s.icon) + '</span></span><span class="txt"><strong>' + s.label + '</strong><small>' + s.hint + '</small></span></button></li>';
      }).join('');
      document.getElementById('count').textContent = 'Étape ' + (S.done ? STEPS.length : S.step + 1) + ' sur ' + STEPS.length;
      document.getElementById('progress').style.width = ((S.step + (S.done ? 1 : 0)) / STEPS.length) * 100 + '%';
    }
    function seg(list, cur, key) { return '<div class="seg">' + list.map(function (v) { return '<button type="button" class="' + (v === cur ? 'on' : '') + '" data-set="' + key + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>'; }
    function tagsTpl() {
      return '<div class="tags" id="tags">' + S.m.invites.map(function (t, i) { return '<span class="tag">' + t + '<button type="button" data-untag="' + i + '" aria-label="Retirer ' + t + '"><span class="mi">close</span></button></span>'; }).join('') +
        '<input id="tag-in" type="email" placeholder="collegue@entreprise.ci" aria-label="Adresse e-mail"></div>' +
        (S.tagError ? '<span class="err"><span class="mi">error</span>' + S.tagError + '</span>' : '') +
        '<div class="sugg">Suggestions : ' + SUGG.filter(function (s) { return S.m.invites.indexOf(s) < 0; }).map(function (s) { return '<button type="button" class="ui-chip" style="height:26px" data-tag="' + s + '">' + s + '</button>'; }).join('') + '</div>';
    }

    function render() {
      rail();
      if (S.done) {
        pane.innerHTML = ExW.result({ icon: 'celebration', title: 'Bienvenue ' + S.m.first + ' !',
          text: 'L\'espace <strong>' + S.m.company + '</strong> est prêt avec ' + S.m.modules.length + ' module(s).' + (S.m.invites.length ? ' ' + S.m.invites.length + ' invitation(s) envoyée(s).' : ''),
          actions: '<button class="ui-btn ui-btn--outlined" data-act="restart">Recommencer</button><a class="ui-btn" href="../app/dashboard.html">Accéder au tableau de bord</a>' });
        return;
      }
      var m = S.m, h;
      if (S.step === 0) h = '<h1>Faisons connaissance</h1><p class="lead">Ces informations apparaissent sur vos commentaires, factures et messages.</p>' +
        '<div class="profile"><span class="avatar" id="avatar" style="background:' + m.color + '">' + initials() + '</span><div class="ui-field"><span class="ui-label">Couleur de l\'avatar</span><div class="swatches">' +
        COLORS.map(function (c) { return '<button type="button" style="background:' + c + '" data-color="' + c + '" aria-pressed="' + (c === m.color) + '" aria-label="Couleur ' + c + '"></button>'; }).join('') + '</div></div></div>' +
        '<div class="row-2"><div class="ui-field"><label class="ui-label" for="first">Prénom</label><div class="field-box"><input id="first" data-model="first" value="' + m.first + '" autocomplete="given-name"></div></div>' +
        '<div class="ui-field"><label class="ui-label" for="last">Nom</label><div class="field-box"><input id="last" data-model="last" value="' + m.last + '" autocomplete="family-name"></div></div></div>' +
        '<div class="ui-field"><span class="ui-label">Votre rôle</span><div class="chips-choice">' + ROLES.map(function (r) { return '<button type="button" class="' + (r === m.role ? 'on' : '') + '" data-set="role" data-v="' + r + '">' + r + '</button>'; }).join('') + '</div></div>';
      else if (S.step === 1) h = '<h1>Votre organisation</h1><p class="lead">Nous adaptons les modèles de factures, les rapports et le vocabulaire à votre activité.</p>' +
        '<div class="ui-field"><label class="ui-label" for="company">Nom de l\'organisation</label><div class="field-box big"><span class="mi">business</span><input id="company" data-model="company" value="' + m.company + '" placeholder="Ex : Sotra Logistique" autocomplete="organization"></div></div>' +
        '<div class="ui-field"><span class="ui-label">Secteur d\'activité</span><div class="choices">' + SECTORS.map(function (s) {
          return '<button type="button" class="choice' + (m.sector === s.id ? ' on' : '') + '" data-set="sector" data-v="' + s.id + '"><span class="c-ic"><span class="mi">' + s.icon + '</span></span><span class="c-txt"><strong>' + s.label + '</strong></span><span class="mark"></span></button>'; }).join('') + '</div></div>' +
        '<div class="ui-field"><span class="ui-label">Nombre d\'employés</span>' + seg(SIZES, m.size, 'size') + '</div>';
      else if (S.step === 2) h = '<h1>Que voulez-vous gérer ?</h1><p class="lead">Choisissez vos modules de départ. Les autres restent disponibles à tout moment.</p><div class="choices mods">' +
        MODULES.map(function (mod) { var on = m.modules.indexOf(mod.id) >= 0;
          return '<button type="button" class="choice square' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-mod="' + mod.id + '"><span class="c-ic"' + (on ? '' : ' style="color:' + mod.color + '"') + '><span class="mi">' + mod.icon + '</span></span>' +
            '<span class="c-txt"><strong>' + mod.label + '</strong><small>' + mod.description + '</small></span><span class="mark"></span></button>'; }).join('') +
        '</div><p class="help">' + m.modules.length + ' module(s) sélectionné(s) · inclus dans l\'essai gratuit</p>';
      else h = '<h1>Invitez votre équipe</h1><p class="lead">Ajoutez des adresses e-mail séparées par une virgule ou Entrée. Vous pouvez aussi le faire plus tard.</p>' +
        '<div class="ui-field"><span class="ui-label">Adresses e-mail</span>' + tagsTpl() + '</div>' +
        '<div class="ui-field"><span class="ui-label">Rôle attribué</span>' + seg(['Administrateur', 'Membre', 'Lecture seule'], m.inviteRole, 'inviteRole') + '</div>' +
        '<div class="share card"><span class="mi">link</span><span><strong>Ou partagez un lien d\'invitation</strong><small>scstorage.ci/rejoindre/7Hk2-pQ</small></span><button type="button" class="ui-btn ui-btn--outlined" data-act="copy">Copier</button></div>';
      pane.innerHTML = h + (S.error ? '<p class="err" role="alert"><span class="mi">error</span>' + S.error + '</p>' : '') +
        '<div class="actions-bar nav">' + (S.step > 0 ? '<button class="ui-btn ui-btn--text" data-act="back"><span class="mi">arrow_back</span>Retour</button>' : '') + '<span class="spacer"></span>' +
        '<button class="ui-btn" data-act="next">' + (S.step === STEPS.length - 1 ? (m.invites.length ? 'Envoyer et terminer' : 'Terminer') : 'Continuer') + '<span class="mi">arrow_forward</span></button></div>';
    }

    function addTag(v) {
      v = v.trim().replace(/,$/, ''); if (!v) return;
      if (!isMail(v)) { S.tagError = 'Adresse e-mail invalide'; return render(), document.getElementById('tag-in').focus(), document.getElementById('tag-in').value = v; }
      S.tagError = ''; if (S.m.invites.indexOf(v) < 0) S.m.invites.push(v); render(); document.getElementById('tag-in').focus();
    }
    function next() {
      var m = S.m;
      var err = [!m.first || !m.last ? 'Indiquez votre prénom et votre nom.' : '', !m.company ? 'Indiquez le nom de votre organisation.' : '', !m.modules.length ? 'Choisissez au moins un module.' : '', ''][S.step];
      S.error = err;
      if (!err) { if (S.step < STEPS.length - 1) S.step++; else S.done = true; }
      render();
    }

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-go],[data-set],[data-color],[data-mod],[data-act],[data-tag],[data-untag]');
      if (!t) return;
      if (t.dataset.go) { S.error = ''; S.step = +t.dataset.go; }
      if (t.dataset.set) S.m[t.dataset.set] = t.dataset.v;
      if (t.dataset.color) S.m.color = t.dataset.color;
      if (t.dataset.mod) { var i = S.m.modules.indexOf(t.dataset.mod); i < 0 ? S.m.modules.push(t.dataset.mod) : S.m.modules.splice(i, 1); }
      if (t.dataset.tag) return addTag(t.dataset.tag);
      if (t.dataset.untag) S.m.invites.splice(+t.dataset.untag, 1);
      if (t.dataset.act === 'next') return next();
      if (t.dataset.act === 'back') { S.error = ''; S.step = Math.max(0, S.step - 1); }
      if (t.dataset.act === 'restart') { S.done = false; S.step = 0; }
      if (t.dataset.act === 'copy') { try { navigator.clipboard.writeText('https://scstorage.ci/rejoindre/7Hk2-pQ'); } catch (x) {} UIKit.toast('Lien copié'); return; }
      render();
    });
    pane.addEventListener('input', function (e) {
      var k = e.target.dataset.model; if (!k) return;
      S.m[k] = e.target.value;
      var a = document.getElementById('avatar'); if (a) a.textContent = initials();
    });
    pane.addEventListener('keydown', function (e) {
      if (e.target.id === 'tag-in') {
        if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(e.target.value); }
        else if (e.key === 'Backspace' && !e.target.value && S.m.invites.length) { S.m.invites.pop(); render(); document.getElementById('tag-in').focus(); }
      } else if (e.key === 'Enter' && e.target.tagName === 'INPUT') next();
    });
    render();
  })();
  </script>
</body>
</html>

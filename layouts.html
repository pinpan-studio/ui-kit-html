<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layouts</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/doc.css">
  <script src="js/themes.js"></script>
  <script src="js/ui-kit.js"></script>
  <style>
    .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: 16px; }
    .lcard { display: flex; flex-direction: column; border-radius: 18px; background: var(--card-bg); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; scroll-margin-top: 72px; }
    .pv { position: relative; display: flex; gap: 6px; height: 190px; padding: 14px; background: linear-gradient(160deg, var(--hover-bg), var(--primary-soft)); }
    .pv > *, .pv .main > *, .pv .content > * { border-radius: 6px; } .pv .rail { width: 22px; background: var(--card-bg); } .pv .main { flex: 1; display: flex; flex-direction: column; gap: 6px; } .pv .bar { height: 18px; background: var(--card-bg); }
    .pv .content { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .pv .content span { background: var(--card-bg); } .pv .content .wide { grid-column: 1 / -1; } .pv .dim { opacity: .5; }
    .pv .split { flex: 1; display: flex; gap: 6px; } .pv .subnav { width: 60px; display: flex; flex-direction: column; gap: 5px; padding: 6px; background: var(--card-bg); border-radius: 6px; } .pv i { display: block; height: 7px; border-radius: 4px; background: var(--hover-bg); } .pv .subnav i:first-child { background: var(--primary-soft); }
    .pv .head { height: 24px; background: var(--card-bg); } .pv .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .pv .kpis b { height: 26px; background: var(--card-bg); border-radius: 6px; } .pv .cols { flex: 1; display: grid; grid-template-columns: 2fr 1fr; gap: 6px; } .pv .cols div { background: var(--card-bg); border-radius: 6px; }
    .pv .visual { flex: 1; background: linear-gradient(135deg, var(--primary), var(--purple)); } .pv .form { width: 45%; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 14px; background: var(--card-bg); } .pv .form b { height: 18px; border-radius: 9px; background: var(--primary); }
    .pv .doc { flex: 1; max-width: 70%; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; padding: 14px; background: var(--card-bg); } .pv .doc .short { width: 60%; } .pv .doc .tbl { flex: 1; border-radius: 4px; background: var(--hover-bg); }
    .pv .drawer { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 30%; display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--card-bg); box-shadow: var(--shadow-2); }
    .pv .dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46%; display: flex; flex-direction: column; gap: 7px; padding: 14px; border-radius: 12px; background: var(--card-bg); box-shadow: var(--shadow-3); } .pv .dialog b { align-self: flex-end; width: 40%; height: 16px; border-radius: 8px; background: var(--primary); }
    .pv .tree { width: 70px; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: var(--card-bg); } .pv .full { flex: 1; } .pv .chat { flex: 1; display: grid; grid-template-columns: 22% 1fr 26%; gap: 6px; } .pv .chat div { background: var(--card-bg); border-radius: 6px; } .pv .chat .c { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 8px; }
    .lbody { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 18px; } .lbody h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; } .lbody h2 .mi { color: var(--primary); } .lbody p { margin: 0; font-size: 13px; color: var(--text-secondary); } .lbody code { font-size: 11px; color: var(--text-muted); } .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  </style>
</head>
<body data-kit data-root="" data-active="layouts.html">
  <main id="kit-content">
    <div class="doc-page" data-title="Layouts" data-icon="dashboard_customize" data-eyebrow="Catalogue" data-subtitle="Les gabarits d'écran complets du kit. Chaque carte montre la structure schématique et ouvre des exemples réels. Les briques de mise en page (grilles, panneaux, conteneurs) sont dans Components › Layout.">
      <div class="lgrid" id="lg"></div>
    </div>
  </main>
  <script src="js/doc.js"></script>
  <script src="js/kit.js"></script>
  <script>
    var W = {
      shell: '<div class="rail"></div><div class="main"><div class="bar"></div><div class="content"><span></span><span></span><span class="wide"></span></div></div>',
      module: '<div class="rail"></div><div class="main"><div class="bar"></div><div class="split"><div class="subnav"><i></i><i></i><i></i><i></i></div><div class="content"><span class="wide"></span><span></span><span></span></div></div></div>',

      drawer: '<div class="rail"></div><div class="main"><div class="bar"></div><div class="content dim"><span></span><span></span><span class="wide"></span></div></div><div class="drawer"><i></i><i></i><i></i></div>',
      dialog: '<div class="main full dim"><div class="bar"></div><div class="content"><span></span><span></span><span class="wide"></span></div></div><div class="dialog"><i></i><i></i><b></b></div>',
      chat: '<div class="chat"><div></div><div class="c"><i style="width:60%"></i><i style="width:40%;align-self:flex-end;background:var(--primary-soft)"></i><i style="width:70%"></i></div><div></div></div>',
      kit: '<div class="tree"><i></i><i></i><i></i><i></i><i></i></div><div class="main"><div class="bar"></div><div class="content"><span class="wide"></span><span></span><span></span></div></div>' };
    var L = [
      ['shell', 'Shell applicatif', 'space_dashboard', 'app/main.html · js/ex-shell.js', 'Rail d’icônes (modules) + barre d’outils (titre, thème, notifications, compte) + contenu + tiroir droit. En mobile, le rail passe en superposition.', [['Ouvrir le shell', 'app/main.html'], ['Tableau de bord', 'examples/app/dashboard.html']]],
      ['module', 'Shell de module', 'view_sidebar', 'js/ex-shell.js · Components › Navigation', 'Sous-navigation propre au module, repliable, à côté du contenu ; le sidecar fusionne rail et sous-menus.', [['Sidecar', 'components/navigation.html#sidebar'], ['Layout de module', 'components/layout.html#sidebar']]],
      ['detail', 'Fiche détail', 'article', 'examples/app/client.html', 'En-tête (retour, titre, statut, actions), grille KPI, colonnes principale + latérale de panneaux, onglets de sous-listes.', [['Fiche client', 'examples/app/client.html']]],
      ['auth', 'Authentification', 'lock', 'examples/auth.html?v=…', 'Onze variantes : centrée, minimale, image, écran partagé, réseaux sociaux, comptes, inscription, oubli, OTP, verrouillage.', [['Split gauche', 'examples/auth.html?v=split-left'], ['Centrée', 'examples/auth.html?v=centered']]],
      ['public', 'Pages publiques / lecture', 'public', 'examples/app/article.html · docs.html', 'Colonne de lecture centrée, sommaire, contenus longs typographiés.', [['Article', 'examples/app/article.html'], ['Documentation', 'examples/app/docs.html']]],
      ['drawer', 'Tiroir droit', 'right_panel_open', 'app/main.html · Components › Feedback', 'Panneau flottant 360px : paramètres du compte, notifications, filtres avancés.', [['Ouvrir l’application', 'app/main.html'], ['Démo tiroir', 'components/feedback.html#drawer']]],
      ['dialog', 'Dialogues', 'open_in_new', 'UIKit.confirm · UIForms.crudDialog', 'Modales de formulaire, confirmations, messages poussés, dialogues de compte.', [['Feedback', 'components/feedback.html#modal'], ['Formulaire en modale', 'components/forms.html#crud-dialog']]],
      ['chat', 'Conversation (trois colonnes)', 'forum', 'harnais/index.html · examples/app/chat.html', 'Historique, fil + zone de saisie, panneau d’artefacts ou d’informations.', [['Harnais', 'harnais/index.html'], ['Messagerie', 'examples/app/chat.html']]],
      ['kit', 'Catalogue (UI Kit)', 'widgets', 'js/kit.js', 'Layout de ce catalogue : barre latérale recherchable, barre supérieure, contenu documentaire.', [['UI Showcase', 'index.html'], ['Pages', 'pages.html']]]];
    document.getElementById('lg').innerHTML = L.map(function (l) { return '<article class="lcard" id="' + l[0] + '"><div class="pv">' + W[l[0]] + '</div><div class="lbody"><h2><span class="mi">' + l[2] + '</span>' + l[1] + '</h2><p>' + l[4] + '</p><code>' + l[3] + '</code><div class="links">' + l[5].map(function (k) { return '<a class="ui-btn ui-btn--outlined ui-btn--sm" href="' + k[1] + '">' + k[0] + '<span class="mi end">arrow_forward</span></a>'; }).join('') + '</div></div></article>'; }).join('');
  </script>
</body>
</html>

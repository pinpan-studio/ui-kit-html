    @media (max-width: 600px) { .l-art { width: 88px; } }

    .res .bar { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--text-muted) 22%, transparent); transition: width .6s var(--ease); }
    .res .lbl { position: relative; flex: 1; display: flex; align-items: center; gap: 8px; } .res .lbl .mi { font-size: 17px; color: var(--primary); } .res b { position: relative; font-size: 13.5px; }

    .post > footer { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px 0; }

    .date b { font-size: 16px; font-weight: 600; line-height: 1.1; color: var(--text-primary); }
    .empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--space-10) var(--space-4); text-align: center; color: var(--text-muted); } .empty .mi { font-size: 36px; } .empty strong { color: var(--text-primary); }

        case 'poll': var t = total(m);
          return '<div class="poll" role="group" aria-label="' + esc(m.question) + '"><strong>' + esc(m.question) + '</strong>' + m.options.map(function (o, i) {
            return m.voted === undefined ? '<button type="button" class="opt" data-vote="' + p.id + '" data-i="' + i + '"><span class="radio"></span>' + esc(o.label) + '</button>'
              : '<div class="res' + (m.voted === i ? ' mine' : '') + '"><span class="bar" style="width:' + (o.votes / t * 100) + '%"></span><span class="lbl">' + esc(o.label) + (m.voted === i ? '<span class="mi">check_circle</span>' : '') + '</span><b>' + Math.round(o.votes / t * 100) + ' %</b></div>';
          }).join('') + '<small>' + t + ' votes · se termine dans 2 jours</small></div>';
      }
      return '';
    }
    function mediaItems(key) {
      var p = posts.find(function (x) { return key.indexOf(x.id + '-') === 0; }), m = p.media[+key.split('-')[1]];
      return m.kind === 'photos' || m.kind === 'files' ? m.items : [m.item];
    }
    function render() {
      $('filters').innerHTML = FILTERS.map(function (f) { return '<button type="button" role="tab" class="chip-filter' + (S.filter === f[0] ? ' on' : '') + '" aria-selected="' + (S.filter === f[0]) + '" data-filter="' + f[0] + '"><span class="mi">' + f[2] + '</span>' + f[1] + '</button>'; }).join('');
      $('left').querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === S.tab); });
      var vis = posts.filter(function (p) { return (S.tab !== 'saved' || p.saved) && (S.filter === 'all' || p.media.some(MATCH[S.filter])); });
      mounts = [];
      $('posts').innerHTML = vis.length ? vis.map(function (p) {
        return '<article class="card post" data-post="' + p.id + '"><header><span class="ava" style="background:' + p.author.color + '">' + D.initials(p.author.name) + '</span><div class="who"><strong>' + esc(p.author.name) + '</strong><small>' + esc(p.author.role) + ' · ' + p.at + ' · <span class="mi">public</span></small></div>' +
          '<details class="ui-menu"><summary class="ui-btn ui-btn--icon" aria-label="Options"><span class="mi">more_horiz</span></summary><div class="ui-menu__panel"><button class="ui-menu__item" data-save="' + p.id + '"><span class="mi">' + (p.saved ? 'bookmark_remove' : 'bookmark_add') + '</span>' + (p.saved ? 'Retirer des enregistrés' : 'Enregistrer') + '</button>' +
          '<button class="ui-menu__item" data-copy="' + location.href.split('#')[0] + '#' + p.id + '"><span class="mi">link</span>Copier le lien</button><button class="ui-menu__item"><span class="mi">notifications_off</span>Ne plus suivre</button></div></details></header>' +
          '<p class="text">' + UIKitUtils.markdownInline(p.text) + '</p>' + p.media.map(function (m, k) { return mediaHtml(p, m, k); }).join('') +
          '<div class="counts"><span><i class="heart"><span class="mi">favorite</span></i>' + p.likes + '</span><button type="button" data-cm="' + p.id + '">' + p.comments.length + ' commentaire(s)</button></div>' +
          '<footer><button type="button" class="' + (p.liked ? 'on' : '') + '" data-like="' + p.id + '"><span class="mi">' + (p.liked ? 'favorite' : 'favorite_border') + '</span>J’aime</button><button type="button" data-cm="' + p.id + '"><span class="mi">chat_bubble_outline</span>Commenter</button>' +
          '<button type="button" class="' + (p.saved ? 'saved' : '') + '" data-save="' + p.id + '"><span class="mi">' + (p.saved ? 'bookmark' : 'bookmark_border') + '</span>Enregistrer</button></footer>' +
          (p.open ? '<div class="post-comments" id="c-' + p.id + '"></div>' : '') + '</article>';
      }).join('') : '<div class="card empty"><span class="mi">' + (S.tab === 'saved' ? 'bookmark_border' : 'filter_alt_off') + '</span><strong>' + (S.tab === 'saved' ? 'Aucune publication enregistrée' : 'Aucune publication de ce type') + '</strong><span>' + (S.tab === 'saved' ? 'Enregistrez une publication pour la retrouver ici.' : 'Essayez un autre filtre.') + '</span></div>';
      mounts.forEach(function (fn) { fn(); });
      vis.forEach(function (p) { if (p.open) UIComp.commentThread(document.getElementById('c-' + p.id), { comments: p.comments, me: ME, mentionables: D.PEOPLE, compact: true, onChange: function (l) { p.comments = l; } }); });
    }
    function renderPending() {
      var el = $('pending'); el.hidden = !S.pending.length && !S.place;
      el.innerHTML = S.pending.map(function (f) { return '<span class="pj">' + Files.thumb(f) + '<span class="pj-txt"><strong>' + esc(f.name) + '</strong><small>' + Files.size(f.size) + '</small></span><button type="button" data-unattach="' + f.id + '" aria-label="Retirer ' + esc(f.name) + '"><span class="mi">close</span></button></span>'; }).join('') +
        (S.place ? '<span class="pj"><span class="mi pin">place</span><span class="pj-txt"><strong>Siège SC Storage</strong><small>Plateau, Abidjan</small></span><button type="button" data-unplace aria-label="Retirer le lieu"><span class="mi">close</span></button></span>' : '');
      document.querySelector('[data-a=place]').disabled = S.place;
    }
    function publish(text) {
      var files = S.pending, media = [], imgs = files.filter(function (f) { return f.kind === 'image'; }), audio = files.filter(function (f) { return f.kind === 'audio'; });
      if (imgs.length) media.push({ kind: 'photos', items: imgs });
      files.filter(function (f) { return f.kind === 'video'; }).forEach(function (v) { media.push({ kind: 'video', title: v.name, item: v }); });
      if (audio.length) media.push({ kind: 'podcast', tracks: audio.map(function (a) { return { title: a.name, artist: ME.name, src: a.url, blob: a.blob }; }) });
      files.filter(function (f) { return f.kind === 'pdf'; }).forEach(function (d) { media.push({ kind: 'document', item: d }); });
      var others = files.filter(function (f) { return ['image', 'video', 'audio', 'pdf'].indexOf(f.kind) < 0; }); if (others.length) media.push({ kind: 'files', items: others });
      if (S.place) media.push({ kind: 'place', name: 'Siège SC Storage', address: 'Immeuble Alpha 2000, Plateau, Abidjan', center: [5.3223, -4.0187], markers: [{ lat: 5.3223, lng: -4.0187, title: 'Siège SC Storage', icon: 'business', tone: 'primary' }] });
      posts.unshift({ id: 'p' + Date.now(), author: ME, at: 'À l’instant', text: text, likes: 0, comments: [], media: media });
      S.pending = []; S.place = false; S.filter = 'all'; renderPending(); render();
    }

    $('left').innerHTML = '<section class="card profile"><div class="cover"></div><span class="ava" style="background:' + ME.color + '">' + D.initials(ME.name) + '</span><strong>' + ME.name + '</strong><small>' + ME.role + ' · SC Storage</small>' +
      '<div class="stats"><div><b>42</b><span>publications</span></div><div><b>318</b><span>abonnés</span></div><div><b>27</b><span>équipes</span></div></div></section>' +
      '<nav class="card menu"><button data-tab="all"><span class="mi">dynamic_feed</span>Tout le fil</button><button data-tab="team"><span class="mi">groups</span>Mon équipe</button><button data-tab="saved"><span class="mi">bookmark</span>Enregistrés</button></nav>';
    $('right').innerHTML = '<section class="card"><h3>Événements à venir</h3>' + [['21', 'oct.', 'Atelier produit', 'Salle Lagune · 10 h'], ['24', 'oct.', 'Inauguration Vridi', 'Entrepôt · 16 h 30'], ['03', 'nov.', 'Revue trimestrielle', 'En ligne · 9 h']].map(function (e) {
      return '<div class="event"><span class="date"><b>' + e[0] + '</b>' + e[1] + '</span><span><strong>' + e[2] + '</strong><small>' + e[3] + '</small></span></div>'; }).join('') + '</section>' +
      '<section class="card"><h3>Collègues</h3>' + D.PEOPLE.slice(1, 5).map(function (u) { return '<div class="mate"><span class="ava" style="background:' + u.color + '">' + D.initials(u.name) + '</span><span><strong>' + u.name + '</strong><small>' + u.role + '</small></span><button class="ui-btn ui-btn--icon" aria-label="Message" onclick="EX.openChat()"><span class="mi">chat</span></button></div>'; }).join('') + '</section>';
    // Zone de saisie (même rendu que le compositeur de commentaires)
    $('composer').innerHTML = '<form class="cc" id="new"><span class="ava" style="background:' + ME.color + ';width:38px;height:38px">' + D.initials(ME.name) + '</span><div class="cc__box"><textarea rows="2" maxlength="600" placeholder="Partagez une info avec l’équipe…" aria-label="Nouvelle publication"></textarea><div class="cc__bar"><span class="help">**gras**, _italique_ · Ctrl+Entrée</span><span class="spacer"></span><button class="ui-btn ui-btn--sm">Publier</button></div></div></form>';
    $('new').addEventListener('submit', function (e) { e.preventDefault(); var t = e.target.querySelector('textarea'); if (!t.value.trim() && !S.pending.length && !S.place) return; publish(t.value.trim()); t.value = ''; });
    $('new').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('new').requestSubmit(); } });

    document.getElementById('ex-content').addEventListener('click', function (e) {
      var t = e.target.closest('[data-a],[data-tab],[data-filter],[data-view],[data-vote],[data-like],[data-save],[data-cm],[data-unattach],[data-unplace]'); if (!t) return;
      var d = t.closest('details'); if (d) d.removeAttribute('open');
      if (t.dataset.a === 'local') return $('local').click();
      if (t.dataset.a === 'drive') return Files.pick({ title: 'Joindre depuis mes fichiers', confirmLabel: 'Joindre' }).then(function (files) { if (files) { files.forEach(function (f) { if (!S.pending.some(function (x) { return x.id === f.id; })) S.pending.push(f); }); renderPending(); } });
      if (t.dataset.a === 'place') { S.place = true; return renderPending(); }
      if (t.dataset.unattach) { S.pending = S.pending.filter(function (f) { return f.id !== t.dataset.unattach; }); return renderPending(); }
      if (t.hasAttribute('data-unplace')) { S.place = false; return renderPending(); }
      if (t.dataset.tab) { S.tab = t.dataset.tab; return render(); }
      if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
      if (t.dataset.view) { var items = mediaItems(t.dataset.view).filter(function (i) { return i && i.url; }), target = mediaItems(t.dataset.view)[+t.dataset.i]; if (target && target.url) Media.viewer(Files.toViewer(items), items.indexOf(target)); return; }
      var p = posts.find(function (x) { return x.id === (t.dataset.vote || t.dataset.like || t.dataset.save || t.dataset.cm); }); if (!p) return;
      if (t.dataset.vote) { var m = p.media.find(function (x) { return x.kind === 'poll'; }); if (m.voted === undefined) { m.voted = +t.dataset.i; m.options[m.voted].votes++; } }
      if (t.dataset.like) { p.liked = !p.liked; p.likes += p.liked ? 1 : -1; }
      if (t.dataset.save) p.saved = !p.saved;
      if (t.dataset.cm) p.open = !p.open;
      var y = document.querySelector('.ex-content').scrollTop; render(); document.querySelector('.ex-content').scrollTop = y;
    });
    $('local').addEventListener('change', function (e) { S.pending = S.pending.concat(Files.addFiles(e.target.files, null)); e.target.value = ''; renderPending(); });
    // La vidéo d'exemple arrive en tâche de fond : on rafraîchit la publication qui l'attend.
    Files.on(function () { if (document.querySelector('.video-wait') && sampleVideo()) { var y = document.querySelector('.ex-content').scrollTop; render(); document.querySelector('.ex-content').scrollTop = y; } });
    render(); renderPending();
  })();
  </script>
</body>
</html>

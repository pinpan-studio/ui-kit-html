<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Déploiement Sotra</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/planning.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .progress { display: flex; align-items: center; gap: 12px; max-width: 420px; margin: -8px 0 20px; } .progress .ui-progress { flex: 1; } .progress strong { font-size: 13px; font-weight: 600; }
    .views { display: inline-flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--hover-bg); margin-bottom: 16px; }
    .views button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: none; font: 500 13px var(--font-sans); color: var(--text-secondary); cursor: pointer; }
    .views button.on { background: var(--card-bg); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-1); } .views .mi { font-size: 18px; }
    @media (max-width: 600px) { .views { display: flex; } .views button { flex: 1; justify-content: center; } .views .lbl { display: none; } }
    .pad { padding: 16px; }
    @media (max-width: 767px) { .ava-stack { display: none; } }
  </style>
</head>
<body data-ex data-root="../../" data-title="Déploiement Sotra" data-crumb="Projets">
  <main id="ex-content">
    <div class="page-head">
      <div class="titles"><span class="eyebrow">Sprint 14 · 13 – 24 octobre</span><h1>Déploiement Sotra Logistique</h1><p id="sub"></p></div>
      <div class="actions"><span class="ava-stack" aria-label="Équipe" id="team"></span>
        <button class="ui-btn ui-btn--outlined"><span class="mi">person_add</span>Partager</button><button class="ui-btn"><span class="mi">add</span>Nouvelle tâche</button></div>
    </div>
    <div class="progress" aria-label="Avancement du sprint"><div class="ui-progress"><span id="bar"></span></div><strong class="tabular" id="pct"></strong></div>
    <div class="views" role="radiogroup" aria-label="Vue" id="views"></div>
    <div id="view"></div>
  </main>

  <script src="../../js/data/ex-utils.js"></script>
  <script src="../../js/planning.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var D = window.DATA, $ = function (id) { return document.getElementById(id); };
    var day = function (d, h) { return new Date(2026, 9, 17 + d, h || 9).toISOString(); };
    var TEAM = ['Jean Kouassi', 'Aïcha Diallo', 'Marc Yao', 'Sarah Bamba'];
    var VIEWS = [{ id: 'kanban', label: 'Tableau', icon: 'view_kanban' }, { id: 'gantt', label: 'Chronologie', icon: 'view_timeline' }, { id: 'calendar', label: 'Calendrier', icon: 'calendar_month' }, { id: 'list', label: 'Par responsable', icon: 'view_agenda' }];
    var COLS = [{ key: 'todo', label: 'À faire', color: 'var(--text-muted)' }, { key: 'doing', label: 'En cours', color: 'var(--info)' }, { key: 'review', label: 'En revue', color: 'var(--warning)' }, { key: 'done', label: 'Terminé', color: 'var(--success)' }];
    var FILTERS = [{ key: 'assignee', label: 'Responsable', options: TEAM.map(function (v) { return { value: v, label: v }; }), value: function (i) { return i.assignee; } }];
    var items = [
      { id: 't1', ref: 'SOT-101', title: 'Audit des entrepôts de Vridi', status: 'todo', assignee: 'Marc Yao', start: day(1), end: day(3, 17), due: day(3), badge: { label: 'Terrain', tone: 'info' } },
      { id: 't2', ref: 'SOT-102', title: 'Import des 1 200 références articles', status: 'todo', assignee: 'Aïcha Diallo', start: day(3), end: day(5, 17), due: day(5), tags: ['data'] },
      { id: 't3', ref: 'SOT-103', title: 'Paramétrage des tarifs transport', status: 'todo', assignee: 'Jean Kouassi', start: day(-3), end: day(-1, 17), due: day(-1), badge: { label: 'Urgent', tone: 'error' } },
      { id: 't4', ref: 'SOT-097', title: 'Formation des chefs de quai', status: 'doing', assignee: 'Sarah Bamba', progress: 60, start: day(-2), end: day(2, 17), due: day(2) },
      { id: 't5', ref: 'SOT-098', title: 'Connexion API balises GPS', status: 'doing', assignee: 'Marc Yao', progress: 35, start: day(-1), end: day(4, 17), due: day(4), badge: { label: 'Technique', tone: 'purple' } },
      { id: 't6', ref: 'SOT-099', title: 'Modèles de bons de livraison', status: 'doing', assignee: 'Aïcha Diallo', progress: 80, start: day(-2), end: day(1, 17), due: day(1) },
      { id: 't7', ref: 'SOT-094', title: 'Recette du module facturation', status: 'review', assignee: 'Jean Kouassi', progress: 90, start: day(-4), end: day(0, 17), due: day(0) },
      { id: 't8', ref: 'SOT-095', title: 'Droits d\'accès par site', status: 'review', assignee: 'Sarah Bamba', start: day(0), end: day(2, 17), due: day(2) },
      { id: 't9', ref: 'SOT-090', title: 'Atelier de cadrage', status: 'done', assignee: 'Jean Kouassi', done: true, progress: 100, start: day(-4), end: day(-4, 17) },
      { id: 't10', ref: 'SOT-091', title: 'Création des comptes utilisateurs', status: 'done', assignee: 'Aïcha Diallo', done: true, progress: 100, start: day(-3), end: day(-3, 17) }
    ].map(function (i) { i.group = i.assignee; return i; });
    var view = 'kanban';
    $('team').innerHTML = TEAM.map(function (p) { return '<span class="ava sm" style="background:' + D.hue(p) + '" title="' + p + '">' + D.initials(p) + '</span>'; }).join('');
    function stats() {
      var done = items.filter(function (i) { return i.status === 'done'; }).length, pct = Math.round(done / items.length * 100);
      $('sub').textContent = done + ' tâches terminées sur ' + items.length + ' · livraison prévue le 24 octobre';
      $('bar').style.width = pct + '%'; $('pct').textContent = pct + ' %';
    }
    function render() {
      $('views').innerHTML = VIEWS.map(function (v) { return '<button type="button" role="radio" aria-checked="' + (v.id === view) + '" class="' + (v.id === view ? 'on' : '') + '" data-view="' + v.id + '"><span class="mi">' + v.icon + '</span><span class="lbl">' + v.label + '</span></button>'; }).join('');
      var el = $('view'); el.className = view === 'gantt' || view === 'calendar' ? 'card pad' : ''; el.innerHTML = '<div></div>';
      var host = el.firstChild, click = function (it) { UIKit.toast(it.ref + ' · ' + it.title); };
      if (view === 'kanban') Planning.kanban(host, { columns: COLS, items: items, wipLimit: 4, searchable: true, filters: FILTERS, lateToggle: true, onItemClick: click, onMove: stats });
      if (view === 'gantt') Planning.gantt(host, { items: items, rowLabel: 'Responsable', zoom: 'day', searchable: true, filters: FILTERS, onItemClick: click });
      if (view === 'calendar') Planning.month(host, { items: items, month: new Date(2026, 9, 1), showDayPanel: true, onItemClick: click });
      if (view === 'list') Planning.grouped(host, { items: items, layout: 'list', searchable: true, lateToggle: true, onItemClick: click });
      stats();
    }
    $('views').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) { view = b.dataset.view; render(); } });
    render();
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showcases</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/device-frame.css">
  <script src="js/themes.js"></script>
  <script src="js/ui-kit.js"></script>
  <style>
    .sc-filters { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-8); }
    .sc-group { margin-bottom: var(--space-12); scroll-margin-top: 90px; }
    .sc-group__head { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); }
    .sc-group__head h2 { margin: 0; font-size: var(--text-xl); }
    .sc-group__head p { margin: 0; color: var(--text-secondary); }
    .sc-group__head > div:nth-child(2) { flex: 1; }
    .sc-count { min-width: 32px; height: 32px; padding: 0 10px; border-radius: 999px; display: grid; place-items: center; background: var(--hover-bg); font-weight: 600; }
    .sc-grid { display: grid; gap: var(--space-5); grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }
    .sc-grid.on-phone { grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); }
    .sc-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card-bg); color: inherit; text-decoration: none; transition: box-shadow var(--dur), transform var(--dur); }
    .sc-card:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
    .sc-thumb { position: relative; height: 240px; padding: var(--space-4); background: linear-gradient(160deg, var(--hover-bg), var(--primary-soft)); }
    .on-phone .sc-thumb, .on-tablet .sc-thumb { height: 320px; }
    .sc-thumb .df-host { pointer-events: none; }
    .sc-open { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0; background: rgb(0 0 0 / .35); color: #fff; font-weight: 600; transition: opacity var(--dur); }
    .sc-card:hover .sc-open { opacity: 1; }
    .sc-body { padding: var(--space-4) var(--space-5) var(--space-5); }
    .sc-title { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); }
    .sc-title .mi { color: var(--primary); }
    .sc-body p { color: var(--text-secondary); font-size: 13px; margin: 0 0 var(--space-2); }
    .sc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .sc-tags span { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--hover-bg); color: var(--text-secondary); }
  </style>
</head>
<body data-kit data-root="" data-active="showcases.html">
  <main id="kit-content">
    <header class="kit-page-head">
      <div class="kit-page-head__icon"><span class="mi">devices</span></div>
      <div><div class="kit-eyebrow">Catalogue</div><h1>Showcases</h1>
        <p>Les sous-modules et des écrans d'exemple, présentés en direct dans une iframe et un cadre d'appareil. Ouvrez une vignette pour basculer entre ordinateur, tablette et mobile, pivoter l'écran et naviguer dans la page.</p></div>
    </header>
    <div class="sc-filters">
      <div class="ui-segmented" role="radiogroup" aria-label="Appareil des vignettes" id="sc-devices"></div>
      <div class="ui-row" id="sc-chips"></div>
    </div>
    <div id="sc-groups"></div>
  </main>

  <script src="js/showcases.js"></script>
  <script src="js/device-frame.js"></script>
  <script src="js/kit.js"></script>
  <script>
    (function () {
      var device = 'desktop', filter = '', frames = [];
      var devBox = document.getElementById('sc-devices'), chips = document.getElementById('sc-chips'), out = document.getElementById('sc-groups');
      try { device = localStorage.getItem('uikit-sc-device') || device; } catch (e) {}

      function renderControls() {
        devBox.innerHTML = Object.keys(DeviceFrame.SPECS).map(function (d) {
          var s = DeviceFrame.SPECS[d];
          return '<button type="button" role="radio" aria-checked="' + (d === device) + '" data-device="' + d + '"><span class="mi">' + s.icon + '</span>' + s.label + '</button>';
        }).join('');
        chips.innerHTML = '<button class="ui-chip" data-filter="" aria-pressed="' + !filter + '">Tout (' + SHOWCASES.length + ')</button>' +
          SHOWCASE_GROUPS.map(function (g) { return '<button class="ui-chip" data-filter="' + g.id + '" aria-pressed="' + (filter === g.id) + '"><span class="mi">' + g.icon + '</span>' + g.label + '</button>'; }).join('');
      }

      function render() {
        frames.forEach(function (f) { f.destroy(); }); frames = [];
        out.innerHTML = SHOWCASE_GROUPS.filter(function (g) { return !filter || g.id === filter; }).map(function (g) {
          var items = SHOWCASES.filter(function (s) { return s.group === g.id; });
          return '<section class="sc-group" id="' + g.id + '"><div class="sc-group__head"><div class="kit-page-head__icon"><span class="mi">' + g.icon + '</span></div>' +
            '<div><h2>' + g.label + '</h2><p>' + g.description + '</p></div><span class="sc-count">' + items.length + '</span></div>' +
            '<div class="sc-grid on-' + device + '">' + items.map(function (s) {
              return '<a class="sc-card" href="showcase.html?id=' + s.id + '&device=' + device + '"><div class="sc-thumb"><div class="df-slot" data-src="' + s.path + '" data-title="' + s.label + '"></div>' +
                '<span class="sc-open"><span class="mi">fullscreen</span>Ouvrir l\'aperçu</span></div><div class="sc-body"><div class="sc-title"><span class="mi">' + s.icon + '</span><strong>' + s.label + '</strong></div>' +
                '<p>' + s.description + '</p><div class="sc-tags">' + (s.tags || []).map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div></div></a>';
            }).join('') + '</div></section>';
        }).join('');
        // Chargement des vignettes à l'approche du viewport
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            io.unobserve(e.target);
            var el = e.target; el.style.height = '100%';
            frames.push(DeviceFrame.mount(el, { src: el.dataset.src, title: el.dataset.title, device: device, thumbnail: true }));
          });
        }, { rootMargin: '300px' });
        out.querySelectorAll('.df-slot').forEach(function (el) { io.observe(el); });
      }

      document.addEventListener('click', function (e) {
        var d = e.target.closest('[data-device]'), f = e.target.closest('[data-filter]');
        if (d) { device = d.dataset.device; try { localStorage.setItem('uikit-sc-device', device); } catch (x) {} renderControls(); render(); }
        if (f) { filter = f.dataset.filter; renderControls(); render(); }
      });
      renderControls(); render();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .masthead { max-width: 1180px; margin: var(--space-2) auto var(--space-8); text-align: center; }
    .masthead h1 { margin: var(--space-2) 0; font-size: clamp(30px, 5vw, 48px); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
    .masthead p { margin: 0 auto; max-width: 52ch; color: var(--text-secondary); font-size: 16px; }
    .feature { max-width: 1180px; margin: 0 auto var(--space-8); display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; text-decoration: none; color: inherit; }
    .feature:hover { background: var(--hover-bg); } .feature:hover h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .f-art, .p-art { display: grid; place-items: center; background: hsl(var(--h) 24% 92%); }
    .f-art { min-height: 300px; } .f-art .mi { font-size: 96px; color: hsl(var(--h) 25% 40%); opacity: .7; }
    [data-mode="dark"] .f-art, [data-mode="dark"] .p-art { background: hsl(var(--h) 14% 18%); } [data-mode="dark"] .f-art .mi, [data-mode="dark"] .p-art .mi { color: hsl(var(--h) 25% 70%); }
    .f-body { display: flex; flex-direction: column; justify-content: center; gap: var(--space-3); padding: clamp(20px, 4vw, 44px); }
    .f-body h2 { margin: 0; font-size: clamp(24px, 3vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
    .f-body p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--text-secondary); }
    @media (max-width: 1100px) { .feature { grid-template-columns: 1fr; } .f-art { min-height: 200px; } }
    .cat { font: 600 11px/1.4 var(--font-sans); text-transform: uppercase; letter-spacing: .06em; color: var(--primary); }
    .byline { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); }
    .byline span:last-child { display: flex; flex-direction: column; } .byline small { font-size: 12px; color: var(--text-muted); }
    .layout { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-8); align-items: start; }
    @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
    .cats { display: flex; gap: var(--space-2); margin-bottom: var(--space-5); overflow-x: auto; scrollbar-width: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--space-8) var(--space-6); }
    .post { display: flex; flex-direction: column; gap: var(--space-2); text-decoration: none; color: inherit; }
    .p-art { aspect-ratio: 16 / 10; margin-bottom: var(--space-2); border-radius: var(--radius-md); transition: transform .25s; } .p-art .mi { font-size: 48px; color: hsl(var(--h) 25% 40%); opacity: .7; }
    .post h3 { margin: 0; font-size: var(--text-lg); line-height: 1.35; font-weight: 600; text-wrap: balance; }
    .post p { margin: 0; line-height: 1.6; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .post .meta { color: var(--text-muted); font-size: 12px; } .post:hover .p-art { transform: scale(1.02); } .post:hover h3 { color: var(--primary); }
    .side { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--space-4); }
    @media (max-width: 1100px) { .side { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
    .side .card { padding: var(--space-5); } .side h3 { margin: 0 0 var(--space-2); font-size: var(--text-lg); font-weight: 600; }
    .newsletter > .mi { color: var(--primary); margin-bottom: var(--space-2); } .newsletter p { margin: 0 0 var(--space-4); font-size: 13px; color: var(--text-secondary); }
    .nl-form { display: flex; flex-direction: column; gap: var(--space-2); }
    .ok { display: flex; align-items: center; gap: var(--space-2); color: var(--success-text); font-weight: 600; margin: 0 !important; }
    .popular ol { margin: 0; padding: 0; list-style: none; } .popular li { display: flex; gap: var(--space-3); padding: var(--space-3) 0; }
    .rank { font-size: 22px; font-weight: 600; line-height: 1; color: var(--text-muted); min-width: 18px; }
    .popular a { font-weight: 500; line-height: 1.4; color: var(--text-primary); text-decoration: none; } .popular a:hover { color: var(--primary); }
    .tags div { display: flex; flex-wrap: wrap; gap: var(--space-2); } .tags span { font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: var(--radius-sm); background: var(--hover-bg); color: var(--text-secondary); }
  </style>
</head>
<body data-ex data-root="../../" data-title="Blog">
  <main id="ex-content">
    <header class="masthead"><span class="text-overline">Le journal du produit</span><h1>Carnets de conception</h1><p>Design, produit et ingénierie : ce que nous apprenons en construisant le kit.</p></header>
    <div id="feature"></div>
    <div class="layout">
      <div><nav class="cats" aria-label="Catégories" id="cats"></nav><div class="grid" id="grid"></div></div>
      <aside class="side">
        <section class="card newsletter"><span class="mi">mark_email_unread</span><h3>La lettre du jeudi</h3><p>Un article, trois liens, zéro spam. Chaque jeudi matin.</p>
          <form class="nl-form" id="nl"><div class="field-box"><span class="mi">mail</span><input name="email" type="email" placeholder="vous@exemple.ci" required aria-label="Adresse e-mail"></div><button class="ui-btn" disabled>S'abonner</button></form></section>
        <section class="card popular"><h3>Les plus lus</h3><ol id="popular"></ol></section>
        <section class="card tags"><h3>Sujets</h3><div id="tags"></div></section>
      </aside>
    </div>
  </main>

  <script src="../../js/data/content.js"></script>
  <script src="../../js/data/ex-utils.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var D = window.DATA, A = D.ARTICLES, cat = 'Tous', $ = function (id) { return document.getElementById(id); };
    var dfmt = function (d, o) { return new Date(d).toLocaleDateString('fr-FR', o); };
    var href = function (a) { return 'article.html?slug=' + a.slug; };
    var f = A.find(function (a) { return a.featured; });
    if (f) $('feature').innerHTML = '<a class="card feature" href="' + href(f) + '"><div class="f-art" style="--h:' + f.hue + '"><span class="mi">' + f.icon + '</span></div><div class="f-body"><span class="cat">' + f.category + ' · À la une</span><h2>' + f.title + '</h2><p>' + f.dek + '</p>' +
      '<div class="byline"><span class="ava" style="background:' + f.author.color + '">' + D.initials(f.author.name) + '</span><span><strong>' + f.author.name + '</strong><small>' + dfmt(f.date, { day: 'numeric', month: 'long', year: 'numeric' }) + ' · ' + f.minutes + ' min de lecture</small></span></div></div></a>';
    function render() {
      $('cats').innerHTML = D.BLOG_CATEGORIES.map(function (c) { return '<button class="chip-filter' + (c === cat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>'; }).join('');
      $('grid').innerHTML = A.filter(function (a) { return !a.featured && (cat === 'Tous' || a.category === cat); }).map(function (a) {
        return '<a class="post" href="' + href(a) + '"><div class="p-art" style="--h:' + a.hue + '"><span class="mi">' + a.icon + '</span></div><span class="cat">' + a.category + '</span><h3>' + a.title + '</h3><p>' + a.dek + '</p>' +
          '<small class="meta">' + a.author.name + ' · ' + dfmt(a.date, { day: 'numeric', month: 'short' }) + ' · ' + a.minutes + ' min</small></a>';
      }).join('');
    }
    $('cats').addEventListener('click', function (e) { var b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; render(); } });
    $('popular').innerHTML = A.slice(0, 4).map(function (a, i) { return '<li><span class="rank">' + (i + 1) + '</span><a href="' + href(a) + '">' + a.title + '</a></li>'; }).join('');
    $('tags').innerHTML = A.reduce(function (s, a) { return s.concat(a.tags); }, []).filter(function (t, i, arr) { return arr.indexOf(t) === i; }).map(function (t) { return '<span>#' + t + '</span>'; }).join('');
    var nl = $('nl');
    nl.addEventListener('input', function () { nl.querySelector('button').disabled = nl.email.value.indexOf('@') < 0; });
    nl.addEventListener('submit', function (e) { e.preventDefault(); nl.outerHTML = '<p class="ok"><span class="mi" style="font-size:18px">check_circle</span>Inscription confirmée pour ' + UIComp_esc(nl.email.value) + '.</p>'; });
    function UIComp_esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    render();
  })();
  </script>
</body>
</html>

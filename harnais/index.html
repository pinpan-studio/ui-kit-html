<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harnais</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/ex.css">
  <link rel="stylesheet" href="../css/planning.css">
  <link rel="stylesheet" href="../css/media.css">
  <link rel="stylesheet" href="../css/harnais.css">
  <script src="../js/ui-kit.js"></script>
</head>
<body>
  <div class="harnais left-open" id="harnais">
    <aside class="hz-left" aria-label="Historique des conversations">
      <div class="hz-lhead"><div class="hz-brand"><span class="hz-logo"><span class="mi">auto_awesome</span></span>Harnais</div>
        <button type="button" class="hz-icon" data-hide-left title="Masquer l'historique" aria-label="Masquer l'historique"><span class="mi">menu_open</span></button></div>
      <button type="button" class="hz-new" id="hz-new"><span class="mi">add</span><span>Nouvelle conversation</span><kbd>⌘K</kbd></button>
      <label class="hz-search"><span class="mi">search</span><input type="search" id="hz-search" placeholder="Rechercher" aria-label="Rechercher une conversation"></label>
      <nav class="hz-list" id="hz-list" aria-label="Conversations"></nav>
      <div class="hz-me" id="hz-me"></div>
    </aside>

    <main class="hz-center">
      <header class="hz-top">
        <button type="button" class="hz-icon" data-show-left title="Afficher l'historique" aria-label="Afficher l'historique"><span class="mi">menu</span></button>
        <button type="button" class="hz-icon" data-show-left data-new title="Nouvelle conversation (⌘K)" aria-label="Nouvelle conversation"><span class="mi">rate_review</span></button>
        <div class="hz-conv-title" id="hz-title"></div>
        <span class="spacer"></span>
        <button type="button" class="ui-btn ui-btn--outlined ui-btn--sm" id="hz-share"><span class="mi">ios_share</span><span>Partager</span></button>
        <button type="button" class="hz-icon" id="hz-toggle-right" title="Artefacts, contexte et tâches" aria-label="Artefacts, contexte et tâches"><span class="mi">view_sidebar</span></button>
        <span class="hz-sep"></span>
        <button type="button" class="hz-icon" id="hz-mode" title="Changer de thème" aria-label="Changer de thème"><span class="mi">dark_mode</span></button>
        <a class="hz-icon" href="../index.html" title="Retour au catalogue UI Kit" aria-label="Retour au catalogue UI Kit"><span class="mi">widgets</span></a>
      </header>
      <div id="hz-main"></div>
    </main>

    <aside class="hz-right" aria-label="Artefacts, contexte et tâches">
      <div class="hz-rhead"><div class="hz-rtabs" role="tablist">
        <button type="button" role="tab" data-tab="artifact"><span class="mi">data_object</span>Artefact</button>
        <button type="button" role="tab" data-tab="context"><span class="mi">folder_open</span>Contexte</button>
        <button type="button" role="tab" data-tab="tasks"><span class="mi">checklist</span>Tâches</button></div>
        <button type="button" class="hz-icon" data-close-right title="Fermer le panneau" aria-label="Fermer le panneau"><span class="mi">close</span></button></div>
      <div id="hz-side-body"></div>
    </aside>
    <button type="button" class="hz-scrim" aria-label="Fermer"></button>
  </div>

  <script src="../js/lib/qr-code.js"></script>
  <script src="../js/lib/markdown.js"></script>
  <script src="../js/lib/diff.js"></script>
  <script src="../js/data/session.js"></script>
  <script src="../js/data/harnais-store.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/data-table.js"></script>
  <script src="../js/map.js"></script>
  <script src="../js/planning.js"></script>
  <script src="../js/media.js"></script>
  <script src="../js/ex-widgets.js"></script>
  <script src="../js/harnais.js"></script>
  <script>
    document.getElementById('hz-mode').firstElementChild.textContent = document.documentElement.getAttribute('data-mode') === 'dark' ? 'light_mode' : 'dark_mode';
    HarnaisUI.init();
  </script>
</body>
</html>

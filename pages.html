<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pages</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/doc.css">
  <script src="js/themes.js"></script>
  <script src="js/ui-kit.js"></script>
  <style>
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 24px; } .filters .search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 21px; background: var(--card-bg); }
    .filters .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 14px var(--font-sans); color: var(--text-primary); } .filters select { height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 21px; background: var(--card-bg); color: var(--text-primary); font: 14px var(--font-sans); }
    .kinds { display: flex; flex-wrap: wrap; gap: 6px; } .count { margin-left: auto; font-size: 13px; color: var(--text-muted); }
    .group { margin-bottom: 36px; scroll-margin-top: 72px; } .ghead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; } .ghead h2 { margin: 0; font-size: 20px; } .ghead p { margin: 2px 0 0; font-size: 13px; color: var(--text-secondary); } .ghead .t { flex: 1; }
    .gcount { min-width: 30px; height: 30px; padding: 0 10px; border-radius: 15px; display: grid; place-items: center; background: var(--hover-bg); font-weight: 600; }
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
    .pcard { display: flex; flex-direction: column; border-radius: 16px; background: var(--card-bg); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; transition: box-shadow .15s, transform .15s; } .pcard:hover { box-shadow: var(--shadow-2), inset 0 0 0 1px var(--border); transform: translateY(-2px); }
    .pcard a.main { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 16px; color: inherit; text-decoration: none; } .pcard .top { display: flex; justify-content: space-between; align-items: center; }
    .pcard .kind { padding: 2px 8px; border-radius: 6px; background: var(--hover-bg); font-size: 11px; font-weight: 600; color: var(--text-secondary); } .pcard .desc { font-size: 13px; color: var(--text-secondary); } .pcard code { font-size: 11px; color: var(--text-muted); word-break: break-all; }
    .vars { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 14px; border-top: 1px solid var(--border); } .vars a { padding: 3px 10px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 600; text-decoration: none; }
    .none { padding: 40px; text-align: center; color: var(--text-muted); }
  </style>
</head>
<body data-kit data-root="" data-active="pages.html">
  <main id="kit-content">
    <div class="doc-page" data-title="Pages" data-icon="view_quilt" data-eyebrow="Catalogue" data-subtitle="Toutes les pages statiques du kit, par catégorie. Cliquez une carte pour ouvrir la page ; les puces ouvrent ses variantes.">
      <div class="filters"><label class="search"><span class="mi muted">search</span><input id="q" placeholder="Rechercher une page, une URL…" aria-label="Rechercher une page"></label><select id="grp" aria-label="Catégorie"><option value="">Toutes les catégories</option></select><div class="kinds" id="kinds"></div><span class="count" id="count"></span></div>
      <div id="groups"></div>
    </div>
  </main>
  <script src="js/pages-registry.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/kit.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); }, R = PAGE_REGISTRY, st = { q: '', g: '', k: '' };
    var KL = { dashboard: ['Tableau de bord', 'dashboard'], list: ['Liste', 'view_list'], detail: ['Détail', 'article'], form: ['Formulaire', 'edit_note'], wizard: ['Assistant', 'linear_scale'], calendar: ['Calendrier', 'calendar_month'], kanban: ['Kanban', 'view_kanban'], settings: ['Paramètres', 'settings'], auth: ['Authentification', 'lock'], other: ['Autre', 'web'] };
    $('grp').innerHTML += R.map(function (g) { return '<option value="' + g.id + '">' + g.label + '</option>'; }).join('');
    function draw() {
      $('kinds').innerHTML = '<button class="ui-filter-chip' + (st.k ? '' : ' on') + '" data-k="">Tous types</button>' + Object.keys(KL).map(function (k) { return '<button class="ui-filter-chip' + (st.k === k ? ' on' : '') + '" data-k="' + k + '"><span class="mi" style="font-size:15px">' + KL[k][1] + '</span>' + KL[k][0] + '</button>'; }).join('');
      var q = st.q.toLowerCase().trim(), n = 0;
      var gs = R.filter(function (g) { return !st.g || g.id === st.g; }).map(function (g) { return { g: g, p: g.pages.filter(function (p) { return (!st.k || p.kind === st.k) && (!q || (p.label + ' ' + p.path + ' ' + (p.description || '') + ' ' + g.label).toLowerCase().indexOf(q) >= 0); }) }; }).filter(function (x) { return x.p.length; });
      $('groups').innerHTML = gs.length ? gs.map(function (x) { n += x.p.length; return '<section class="group" id="' + x.g.id + '"><div class="ghead"><span class="ic-tile tone-primary"><span class="mi">' + x.g.icon + '</span></span><div class="t"><h2>' + x.g.label + '</h2><p>' + (x.g.description || '') + '</p></div><span class="gcount">' + x.p.length + '</span></div><div class="pgrid">' +
        x.p.map(function (p) { return '<div class="pcard"><a class="main" href="' + p.path + '"><span class="top"><span class="ic-tile"><span class="mi">' + KL[p.kind][1] + '</span></span><span class="kind">' + KL[p.kind][0] + '</span></span><strong>' + p.label + '</strong>' + (p.description ? '<span class="desc">' + p.description + '</span>' : '') + '<code>' + p.path + '</code></a>' + (p.variants ? '<div class="vars">' + p.variants.map(function (v) { return '<a href="' + v.path + '">' + v.label + '</a>'; }).join('') + '</div>' : '') + '</div>'; }).join('') + '</div></section>'; }).join('')
        : '<div class="none"><span class="mi" style="font-size:36px">search_off</span><br>Aucune page ne correspond. <button class="ui-btn ui-btn--text" id="reset">Réinitialiser</button></div>';
      $('count').textContent = n + ' page(s)';
      var r = $('reset'); if (r) r.onclick = function () { st = { q: '', g: '', k: '' }; $('q').value = ''; $('grp').value = ''; draw(); };
    }
    $('q').oninput = function () { st.q = this.value; draw(); }; $('grp').onchange = function () { st.g = this.value; draw(); };
    $('kinds').onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) { st.k = b.dataset.k; draw(); } };
    draw();
  })();
  </script>
</body>
</html>

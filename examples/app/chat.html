<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messagerie instantanée</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/media.css">
  <link rel="stylesheet" href="../../css/files.css">
  <link rel="stylesheet" href="../../css/chat.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .chat { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); border-radius: var(--radius-2xl); overflow: hidden; }
    .chat.info-open { grid-template-columns: 340px minmax(0, 1fr) 300px; }
    @media (max-width: 1280px) { .chat { grid-template-columns: 300px minmax(0, 1fr); } .chat.info-open { grid-template-columns: 300px minmax(0, 1fr); } .chat.info-open .info { position: absolute; z-index: 5; right: 0; top: 0; bottom: 0; width: 300px; box-shadow: -8px 0 24px rgba(0,0,0,.12); } }
    @media (max-width: 767px) { .chat { grid-template-columns: minmax(0, 1fr); border-radius: 0; } .chat .main { display: none; } .chat.has-conv .list { display: none; } .chat.has-conv .main { display: flex; } .chat.info-open .info { position: absolute; inset: 0; width: auto; } }
    .list { min-height: 0; display: flex; flex-direction: column; background: var(--card-bg); }
    .lh { display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 0 16px; } .lh h1 { margin: 0; font-size: var(--text-xl); font-weight: 600; }
    .lh .ui-menu__panel { max-height: 320px; overflow: auto; }
    .main { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
    .mh { flex: none; display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 8px 0 12px; } .mh .back { display: none !important; } @media (max-width: 767px) { .mh .back { display: inline-flex !important; } }
    .mh .on { color: var(--primary); }
    .who { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 4px 8px 4px 4px; border: 0; border-radius: var(--radius-md); background: none; cursor: pointer; text-align: left; font: inherit; color: inherit; } .who:hover { background: var(--hover-bg); }
    .who .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; } .who strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who small { font-size: 12px; color: var(--text-muted); } .who small.typing { color: var(--success-text); }
    .chat .av .ava { width: 40px; height: 40px; }
    .placeholder { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--text-muted); } .placeholder > .mi { font-size: 56px; opacity: .6; }
    .placeholder h2 { margin: 12px 0 4px; font-size: var(--text-xl); font-weight: 600; color: var(--text-primary); } .placeholder p { margin: 0; font-size: 13px; }
    .info { min-height: 0; overflow-y: auto; background: var(--card-bg); }
    .info section { padding: 12px 20px 16px; } .info h3 { margin: 0 0 12px; font: 600 11px/1.4 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); } .info .none { margin: 0; font-size: 13px; color: var(--text-muted); }
    .ih { display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 12px 0 8px; }
    .profile { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4px 20px 20px; }
    .profile .xl { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 600; } .profile .xl.grp { border-radius: var(--radius-2xl); } .profile .xl .mi { font-size: 40px; }
    .profile h2 { margin: 12px 0 2px; font-size: var(--text-lg); font-weight: 600; } .profile small { font-size: 12px; color: var(--text-muted); } .profile p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
    .quick { display: flex; gap: 8px; margin-top: 16px; } .quick button { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; padding: 8px 4px; border: 0; border-radius: var(--radius-md); background: var(--hover-bg); cursor: pointer; font: 500 11px var(--font-sans); color: var(--text-secondary); } .quick .mi { color: var(--primary); }
    .member { display: flex; align-items: center; gap: 12px; padding: 5px 0; } .member .ava { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; }
    .member .ava i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 2px var(--card-bg); }
    .member > span:last-child { display: flex; flex-direction: column; min-width: 0; } .member strong { font-size: 13px; } .member small { font-size: 12px; color: var(--text-muted); }
    .media { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; } .media button { aspect-ratio: 1; padding: 0; border: 0; border-radius: var(--radius-sm); overflow: hidden; cursor: zoom-in; background: var(--hover-bg); } .media img { width: 100%; height: 100%; object-fit: cover; }
    .doc { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; margin: 0 -6px; border: 0; border-radius: var(--radius-sm); background: none; cursor: pointer; text-align: left; font: inherit; color: inherit; } .doc:hover { background: var(--hover-bg); }
    .doc img { width: 30px; height: 30px; object-fit: contain; } .doc span { min-width: 0; display: flex; flex-direction: column; } .doc strong { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .doc small { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body data-ex data-root="../../" data-title="Messagerie instantanée" data-crumb="Communication" data-flush data-no-chat>
  <main id="ex-content"><div class="chat" id="chat">
    <aside class="list"><header class="lh"><h1>Discussions</h1><details class="ui-menu"><summary class="ui-btn ui-btn--icon" title="Nouvelle conversation" aria-label="Nouvelle conversation"><span class="mi">edit_square</span></summary><div class="ui-menu__panel" id="contacts"></div></details></header><div id="list" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></aside>
    <section class="main" id="main"></section>
    <aside class="info" id="info" hidden></aside>
  </div></main>

  <script src="../../js/data/media.js"></script>
  <script src="../../js/lib/markdown.js"></script>
  <script src="../../js/media.js"></script>
  <script src="../../js/files.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script src="../../js/ex-chat.js"></script>
  <script>
  (function () {
    var C = ExChat, $ = function (id) { return document.getElementById(id); }, esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    C.ensure();
    var q = new URLSearchParams(location.search).get('c');
    var S = { cur: q && C.conv(q) ? q : innerWidth >= 768 ? 'c-aya' : null, info: innerWidth >= 1500 }, thread, list;
    $('contacts').innerHTML = C.people.filter(function (p) { return p.id !== C.ME; }).map(function (p) { return '<button class="ui-menu__item" data-new="' + p.id + '"><span class="mi">person</span>' + p.name + '</button>'; }).join('');
    list = C.list($('list'), { selected: S.cur, onPick: select });
    function status(c) {
      if (c.typing) return C.person(c.typing).name.split(' ')[0] + ' est en train d’écrire…';
      if (c.kind === 'direct') return C.peer(c).online ? 'En ligne' : 'Vu aujourd’hui à 09:12';
      return c.members.length + ' membres · ' + c.members.filter(function (m) { return C.person(m).online; }).length + ' en ligne';
    }
    function shared(c) { return c.messages.reduce(function (a, m) { return a.concat(m.attachments || []); }, []); }
    function renderMain() {
      if (thread) thread.destroy(); thread = null;
      var c = C.conv(S.cur); C.activePage = S.cur;
      $('chat').classList.toggle('has-conv', !!c); $('chat').classList.toggle('info-open', !!(S.info && c)); $('info').hidden = !(S.info && c);
      if (!c) { $('main').innerHTML = '<div class="placeholder"><span class="mi">forum</span><h2>Vos discussions</h2><p>Sélectionnez une conversation ou démarrez-en une nouvelle.</p></div>'; return; }
      $('main').innerHTML = '<header class="mh"><button class="ui-btn ui-btn--icon back" data-back aria-label="Retour"><span class="mi">arrow_back</span></button><button type="button" class="who" data-info>' + C.avatar(c) +
        '<span class="txt"><strong>' + (c.kind === 'channel' ? '# ' : '') + esc(C.title(c)) + '</strong><small id="st"></small></span></button><span class="spacer"></span>' +
        '<button class="ui-btn ui-btn--icon" data-call="vocal" title="Appel vocal" aria-label="Appel vocal"><span class="mi">call</span></button><button class="ui-btn ui-btn--icon" data-call="vidéo" title="Appel vidéo" aria-label="Appel vidéo"><span class="mi">videocam</span></button>' +
        '<button class="ui-btn ui-btn--icon' + (S.info ? ' on' : '') + '" data-info title="Détails" aria-label="Détails"><span class="mi">info</span></button></header><div id="thread" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>';
      thread = C.thread($('thread'), { convId: c.id });
      renderInfo(); renderStatus();
    }
    function renderStatus() { var c = C.conv(S.cur), st = $('st'); if (c && st) { st.textContent = status(c); st.classList.toggle('typing', !!c.typing); } }
    function renderInfo() {
      var c = C.conv(S.cur); if (!c || !S.info) return;
      var sh = shared(c), media = sh.filter(function (a) { return a.kind === 'image' && a.url; }), docs = sh.filter(function (a) { return !(a.kind === 'image' && a.url); });
      $('info').innerHTML = '<header class="ih"><button class="ui-btn ui-btn--icon" data-info aria-label="Fermer les détails"><span class="mi">close</span></button><strong>Détails</strong></header>' +
        '<div class="profile">' + (c.kind === 'direct' ? '<span class="xl" style="background:' + C.peer(c).color + '">' + C.initials(C.title(c)) + '</span>' : '<span class="xl grp" style="background:' + c.color + '"><span class="mi">' + c.icon + '</span></span>') +
        '<h2>' + (c.kind === 'channel' ? '# ' : '') + esc(C.title(c)) + '</h2><small>' + (c.kind === 'direct' ? C.peer(c).role + ' · ' + (C.peer(c).online ? 'en ligne' : 'hors ligne') : c.members.length + ' membres') + '</small>' + (c.description ? '<p>' + esc(c.description) + '</p>' : '') +
        '<div class="quick"><button data-call="vocal"><span class="mi">call</span>Appeler</button><button data-mute><span class="mi">' + (c.muted ? 'notifications_off' : 'notifications') + '</span>' + (c.muted ? 'Réactiver' : 'Sourdine') + '</button><button data-pin><span class="mi">push_pin</span>' + (c.pinned ? 'Désépingler' : 'Épingler') + '</button></div></div>' +
        (c.kind !== 'direct' ? '<section><h3>Membres · ' + c.members.length + '</h3>' + c.members.map(function (m) { var p = C.person(m); return '<div class="member"><span class="ava" style="background:' + p.color + '">' + C.initials(p.name) + (p.online ? '<i></i>' : '') + '</span><span><strong>' + (m === C.ME ? 'Vous' : p.name) + '</strong><small>' + p.role + '</small></span></div>'; }).join('') + '</section>' : '') +
        '<section><h3>Médias · ' + media.length + '</h3>' + (media.length ? '<div class="media">' + media.slice(0, 9).map(function (a, i) { return '<button type="button" data-media="' + i + '"><img src="' + a.url + '" alt="' + esc(a.name) + '"></button>'; }).join('') + '</div>' : '<p class="none">Aucun média partagé.</p>') + '</section>' +
        '<section><h3>Fichiers · ' + docs.length + '</h3>' + (docs.length ? docs.map(function (a, i) { return '<button type="button" class="doc" data-doc="' + i + '"><img src="../../assets/icons-files/' + Files.KINDS[a.kind].img + '" alt=""><span><strong>' + esc(a.name) + '</strong><small>' + Files.size(a.size) + '</small></span></button>'; }).join('') : '<p class="none">Aucun fichier partagé.</p>') + '</section>';
      $('info').onclick = function (e) {
        var t = e.target.closest('[data-media],[data-doc]'); if (!t) return;
        var l = t.dataset.media !== undefined ? media : docs.filter(function (a) { return a.url; }), a = l[+(t.dataset.media || t.dataset.doc)];
        if (a && a.url) Media.viewer(l.map(function (x) { return { name: x.name, url: x.url, type: x.mime, size: x.size, blob: x.blob }; }), l.indexOf(a));
      };
    }
    function select(id) { S.cur = id; list.select(id); renderMain(); }
    document.getElementById('ex-content').addEventListener('click', function (e) {
      var t = e.target.closest('[data-new],[data-back],[data-info],[data-call],[data-mute],[data-pin]'); if (!t) return;
      var d = t.closest('details'); if (d) d.removeAttribute('open');
      if (t.dataset.new) select(C.startDirect(t.dataset.new));
      if (t.hasAttribute('data-back')) { S.cur = null; list.select(null); renderMain(); }
      if (t.hasAttribute('data-info')) { S.info = !S.info; renderMain(); }
      if (t.dataset.call) UIKit.toast('Appel ' + t.dataset.call + ' avec ' + C.title(C.conv(S.cur)) + ' (exemple statique)');
      if (t.hasAttribute('data-mute')) { C.toggleMute(S.cur); renderInfo(); }
      if (t.hasAttribute('data-pin')) { C.togglePin(S.cur); renderInfo(); }
    });
    C.on(function () { renderStatus(); });
    renderMain();
  })();
  </script>
</body>
</html>

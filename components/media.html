  <style>
    .vertical { max-width: 260px; margin: 0 auto; }
    .yt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; } .yt-list figcaption { margin-top: 6px; font-size: 13px; font-weight: 600; }
    .ext-ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; } .evlog { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: #0f172a; color: #e2e8f0; font: 11.5px/1.5 var(--font-mono); max-height: 90px; overflow: auto; }
    .att { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; } .att button { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); cursor: zoom-in; text-align: left; font: 12px var(--font-sans); color: var(--text-primary); }
    .att .th { display: grid; place-items: center; height: 90px; border-radius: 8px; background: var(--hover-bg); overflow: hidden; } .att .th img { width: 100%; height: 100%; object-fit: cover; } .att .th .mi { font-size: 36px; color: var(--text-muted); } .att small { color: var(--text-muted); }
    .multi { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; } .multi > * { flex: 0 0 min(260px, 80%); scroll-snap-align: start; padding: 14px; border-radius: 12px; background: color-mix(in srgb, var(--tone) 10%, var(--card-bg)); border: 1px solid var(--border); }
    .multi .mi { color: var(--tone); font-size: 28px; } .multi strong { display: block; margin: 6px 0 2px; } .multi p { margin: 0; font-size: 13px; color: var(--text-secondary); }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; } .filters .sp { flex: 1; }
    .just { display: flex; flex-wrap: wrap; gap: 6px; } .just::after { content: ""; flex-grow: 999; } .just figure { position: relative; margin: 0; flex-grow: var(--r); flex-basis: calc(var(--r) * 150px); height: 150px; cursor: zoom-in; border-radius: 8px; overflow: hidden; } .just img { width: 100%; height: 100%; object-fit: cover; }
    .just .ck { position: absolute; top: 6px; left: 6px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.4); color: #fff; opacity: 0; } .just figure:hover .ck, .just figure.sel .ck { opacity: 1; } .just figure.sel { outline: 3px solid var(--primary); outline-offset: -3px; } .just figure.sel .ck { background: var(--primary); }
    .grid-sq { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; } .grid-sq img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: zoom-in; display: block; } .grid-169 img { aspect-ratio: 16 / 9; } .grid-169 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .theater { display: grid; grid-template-columns: minmax(0, 2fr) minmax(220px, 1fr); gap: 14px; } @media (max-width: 800px) { .theater { grid-template-columns: 1fr; } }
    .pl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; } .pl li { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; } .pl li:hover, .pl li.on { background: var(--hover-bg); } .pl li.on strong { color: var(--primary); }
    .pl .thumb { display: grid; place-items: center; width: 80px; height: 46px; flex: none; border-radius: 6px; background: linear-gradient(135deg, #0f766e, #1e293b); color: #fff; } .pl small { color: var(--text-muted); font-size: 12px; } .pl strong { font-size: 13px; }
    .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; } .vgrid figcaption { margin-top: 6px; font-size: 13px; }
    .masonry { columns: 3 220px; column-gap: 12px; } .masonry > * { break-inside: avoid; margin-bottom: 12px; } .mcard { padding: 14px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--border); } .mcard .mi { color: var(--primary); } .mcard p { margin: 6px 0 0; font-size: 13px; color: var(--text-secondary); }
    .masonry img { width: 100%; display: block; border-radius: 10px; }
    .crop { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 16px; align-items: start; } @media (max-width: 700px) { .crop { grid-template-columns: 1fr; } }
    .crop-stage { position: relative; height: 280px; overflow: hidden; border-radius: 12px; background: #0f172a; cursor: grab; touch-action: none; user-select: none; } .crop-stage img { position: absolute; left: 50%; top: 50%; transform-origin: center; pointer-events: none; max-width: none; }
    .crop-mask { position: absolute; inset: 0; pointer-events: none; } .crop-mask i { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 999px rgba(15,23,42,.6); border: 2px solid #fff; }
    .crop-ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; } .crop-ctl input { flex: 1; accent-color: var(--primary); }
    .crop-out { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); } .crop-out img { border: 1px solid var(--border); }
  </style>

      host.innerHTML = '<div class="crop"><div><div class="crop-stage"><img alt="" draggable="false"><div class="crop-mask"><i></i></div></div><div class="crop-ctl"><span class="mi">zoom_out</span><input type="range" min="1" max="3" step="0.01" value="1" aria-label="Zoom"><span class="mi">zoom_in</span><label class="ui-btn ui-btn--text ui-btn--sm"><span class="mi">upload</span>Autre image<input type="file" accept="image/*" hidden></label></div></div><div class="crop-out"><canvas></canvas><button class="ui-btn ui-btn--sm"><span class="mi">crop</span>Exporter</button><span></span></div></div>';

      function size() { var W = stage.clientWidth, H = stage.clientHeight, fh = Math.min(H - 40, (W - 40) / ratio), fw = fh * ratio; frame.style.width = fw + 'px'; frame.style.height = fh + 'px'; frame.style.borderRadius = round ? '50%' : '8px'; return { fw: fw, fh: fh }; }
      function fit() { var f = size(); st.base = Math.max(f.fw / img.naturalWidth, f.fh / img.naturalHeight); st.x = st.y = 0; st.z = 1; zoom.value = 1; apply(); }
      function clamp() { var f = size(), s = st.base * st.z, mx = Math.max(0, (img.naturalWidth * s - f.fw) / 2), my = Math.max(0, (img.naturalHeight * s - f.fh) / 2); st.x = Math.max(-mx, Math.min(mx, st.x)); st.y = Math.max(-my, Math.min(my, st.y)); }
      function apply() { clamp(); var s = st.base * st.z; img.style.width = img.naturalWidth + 'px'; img.style.transform = 'translate(calc(-50% + ' + st.x + 'px), calc(-50% + ' + st.y + 'px)) scale(' + s + ')'; }
      function exp() { var f = size(), s = st.base * st.z, outW = round ? 128 : 256, outH = Math.round(outW / ratio); cv.width = outW; cv.height = outH; cv.style.width = (round ? 96 : 150) + 'px'; cv.style.borderRadius = round ? '50%' : '6px'; var g = cv.getContext('2d');
        var sx = img.naturalWidth / 2 - (f.fw / 2 + st.x) / s, sy = img.naturalHeight / 2 - (f.fh / 2 + st.y) / s; g.clearRect(0, 0, outW, outH); g.drawImage(img, sx, sy, f.fw / s, f.fh / s, 0, 0, outW, outH);
        host.querySelector('.crop-out span').textContent = outW + ' × ' + outH + ' px · PNG'; }
      img.onload = function () { fit(); exp(); }; img.src = src;
      zoom.oninput = function () { st.z = +zoom.value; apply(); };
      stage.addEventListener('wheel', function (e) { e.preventDefault(); st.z = Math.max(1, Math.min(3, st.z - e.deltaY * 0.0015)); zoom.value = st.z; apply(); }, { passive: false });
      stage.addEventListener('pointerdown', function (e) { stage.setPointerCapture(e.pointerId); var sx = e.clientX - st.x, sy = e.clientY - st.y; stage.onpointermove = function (ev) { st.x = ev.clientX - sx; st.y = ev.clientY - sy; apply(); }; stage.onpointerup = function () { stage.onpointermove = null; exp(); }; });
      host.querySelector('.crop-out button').onclick = function () { exp(); cv.toBlob(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = round ? 'avatar.png' : 'banniere.png'; a.click(); }); };
      host.querySelector('input[type=file]').onchange = function () { if (this.files[0]) img.src = URL.createObjectURL(this.files[0]); };
      new ResizeObserver(function () { if (img.naturalWidth) { apply(); } }).observe(stage);
    });

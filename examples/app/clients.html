<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .status-tabs { display: flex; gap: var(--space-1); margin-bottom: var(--space-4); overflow-x: auto; scrollbar-width: none; }
    .status-tabs button { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); height: 40px; padding: 0 var(--space-3); border: 0; background: none; cursor: pointer; white-space: nowrap; font: 500 14px var(--font-sans); color: var(--text-secondary); }
    .status-tabs span { min-width: 20px; padding: 0 var(--space-2); border-radius: var(--radius-md); background: var(--hover-bg); font-size: 11.5px; font-weight: 600; line-height: 20px; }
    .status-tabs button:hover { color: var(--text-primary); }
    .status-tabs button.on { color: var(--text-primary); font-weight: 600; } .status-tabs button.on span { background: var(--primary-soft); color: var(--primary); }
    .status-tabs button.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--primary); }
    .filters { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
    .fdd > summary { list-style: none; } .fdd > summary::-webkit-details-marker { display: none; }
    .fdd .ui-menu__panel { left: 0; right: auto; max-height: 300px; overflow: auto; }
    .fdd .count { margin-left: auto; font-size: 12px; color: var(--text-muted); }
    .vmode { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-sm); background: var(--hover-bg); }
    .vmode button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font: 500 13px var(--font-sans); color: var(--text-secondary); cursor: pointer; }
    .vmode button.on { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow-1); } .vmode .mi { font-size: 18px; }
    @media (max-width: 767px) { .vmode .lbl { display: none; } }
    .preview { display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap; }
    .preview span { display: flex; flex-direction: column; font-size: 13px; } .preview small { font-size: 12px; color: var(--text-muted); } .preview .ui-btn { margin-left: auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-3); }
    @media (max-width: 767px) { .cards { grid-template-columns: minmax(0, 1fr); } }
    .ccard { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); text-align: left; color: inherit; font: inherit; cursor: pointer; border: 0; }
    .ccard:hover { background: var(--hover-bg); }
    .cc-top { display: flex; align-items: center; gap: var(--space-3); }
    .cc-top .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; } .cc-top strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cc-top small { font-size: 12px; color: var(--text-muted); }
    .cc-meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: var(--space-3); margin: 0; padding-top: var(--space-3); }
    .cc-meta dt { font-size: 12px; color: var(--text-muted); } .cc-meta dd { margin: 2px 0 0; font-size: 13px; font-weight: 500; white-space: nowrap; } .cc-meta .num { font-weight: 600; }
    .pager { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
    .pager select { height: 32px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card-bg); color: var(--text-primary); }
  </style>
</head>
<body data-ex data-root="../../" data-title="Clients" data-crumb="CRM">
  <main id="ex-content">
    <div class="page-head">
      <div class="titles"><span class="eyebrow">CRM</span><h1>Clients</h1><p id="sub"></p></div>
      <div class="actions">
        <button class="ui-btn ui-btn--outlined"><span class="mi">upload</span>Importer</button>
        <button class="ui-btn"><span class="mi">add</span>Nouveau client</button>
      </div>
    </div>
    <nav class="status-tabs" aria-label="Filtrer par statut" id="tabs"></nav>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </main>

  <script src="../../js/data/examples.js"></script>
  <script src="../../js/data/ex-utils.js"></script>
  <script src="../../js/data-table.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var D = window.DATA, ALL = D.EX_CLIENTS, ST = D.CLIENT_STATUS, nf = new Intl.NumberFormat('fr-FR');
    var S = { status: '', city: null, owner: null, view: innerWidth < 768 ? 'card' : 'list', page: 1, size: 6 };
    var $ = function (id) { return document.getElementById(id); };
    function opts(k) { return ALL.map(function (c) { return c[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort().map(function (v) { return { v: v, n: ALL.filter(function (c) { return c[k] === v; }).length }; }); }
    var CITY = opts('city'), OWNER = opts('owner');
    function rows() { return ALL.filter(function (c) { return (!S.status || c.status === S.status) && (!S.city || c.city === S.city) && (!S.owner || c.owner === S.owner); }); }
    function open(c) { location.href = 'client.html?id=' + c.id; }
    $('sub').textContent = ALL.length + ' comptes · ' + nf.format(Math.round(ALL.reduce(function (s, c) { return s + c.revenue; }, 0) / 1e6)) + ' M FCFA de chiffre d\'affaires cumulé';

    function dropdown(key, label, list) {
      return '<details class="ui-menu fdd"><summary class="chip-filter' + (S[key] ? ' on' : '') + '">' + label + (S[key] ? ' : ' + S[key] : '') + '<span class="mi">expand_more</span></summary><div class="ui-menu__panel">' +
        '<button class="ui-menu__item" data-f="' + key + '" data-v=""><span class="mi">' + (S[key] ? 'radio_button_unchecked' : 'radio_button_checked') + '</span>Tous</button>' +
        list.map(function (o) { return '<button class="ui-menu__item" data-f="' + key + '" data-v="' + o.v + '"><span class="mi">' + (S[key] === o.v ? 'radio_button_checked' : 'radio_button_unchecked') + '</span>' + o.v + '<span class="count">' + o.n + '</span></button>'; }).join('') + '</div></details>';
    }
    function controls() {
      $('tabs').innerHTML = '<button class="' + (!S.status ? 'on' : '') + '" data-st="">Tous<span>' + ALL.length + '</span></button>' + Object.keys(ST).map(function (s) {
        return '<button class="' + (S.status === s ? 'on' : '') + '" data-st="' + s + '">' + ST[s].label + '<span>' + ALL.filter(function (c) { return c.status === s; }).length + '</span></button>'; }).join('');
      $('filters').innerHTML = dropdown('city', 'Ville', CITY) + dropdown('owner', 'Responsable', OWNER) +
        (S.city || S.owner ? '<button class="ui-btn ui-btn--text ui-btn--sm" data-clear>Effacer les filtres</button>' : '') + '<span class="spacer"></span>' +
        '<div class="vmode" role="radiogroup" aria-label="Affichage"><button class="' + (S.view === 'list' ? 'on' : '') + '" data-view="list" role="radio" aria-checked="' + (S.view === 'list') + '"><span class="mi">view_list</span><span class="lbl">Liste</span></button>' +
        '<button class="' + (S.view === 'card' ? 'on' : '') + '" data-view="card" role="radio" aria-checked="' + (S.view === 'card') + '"><span class="mi">grid_view</span><span class="lbl">Cartes</span></button></div>';
    }
    var table;
    function list() {
      var r = rows(), el = $('list');
      if (!r.length) { el.innerHTML = '<div class="card ui-empty"><span class="mi" style="font-size:40px">search_off</span><p><strong>Aucun client</strong></p><p class="muted">Aucun compte ne correspond à ces critères.</p></div>'; table = null; return; }
      if (S.view === 'list') {
        el.innerHTML = '<div id="dt"></div>';
        table = DataTable.mount(document.getElementById('dt'), { rows: r, selectable: true, pageSize: 10, maxHeight: 'none', clickable: true, onRowClick: open,
          bulkActions: [{ id: 'mail', label: 'E-mail', icon: 'mail' }, { id: 'tag', label: 'Étiqueter', icon: 'label' }, { id: 'delete', label: 'Supprimer', icon: 'delete', tone: 'error' }],
          onBulk: function (a, sel) { UIKit.toast({ mail: 'E-mail préparé pour', tag: 'Étiquette ajoutée à', delete: 'Suppression simulée de' }[a.id] + ' ' + sel.length + ' client(s)'); },
          expanded: function (row) { return '<div class="preview"><span><small>Contact</small>' + row.contact + '</span><span><small>Téléphone</small>' + row.phone + '</span><span><small>Factures</small>' + row.invoices + '</span><span><small>Responsable</small>' + row.owner + '</span>' +
            '<a class="ui-btn ui-btn--outlined ui-btn--sm" href="client.html?id=' + row.id + '">Ouvrir la fiche<span class="mi">arrow_forward</span></a></div>'; },
          columns: [
            { key: 'name', label: 'Client', width: 220, sticky: 'start', required: true }, { key: 'sector', label: 'Secteur', width: 140 }, { key: 'contact', label: 'Contact', width: 170 },
            { key: 'email', label: 'E-mail', width: 230, hidden: true }, { key: 'city', label: 'Ville', width: 120 },
            { key: 'status', label: 'Statut', width: 110, type: 'badge', format: function (x) { return ST[x.status].label; }, tone: function (x) { return ST[x.status].color; } },
            { key: 'invoices', label: 'Factures', width: 90, type: 'number' },
            { key: 'revenue', label: 'Chiffre d\'affaires', width: 150, type: 'currency', total: true, format: function (x) { return nf.format(x.revenue) + ' F'; }, totalFormat: function (t) { return nf.format(t) + ' F'; } },
            { key: 'since', label: 'Client depuis', width: 130, hidden: true, format: function (x) { return new Date(x.since).toLocaleDateString('fr-FR'); } }] });
      } else {
        var pages = Math.max(1, Math.ceil(r.length / S.size)); S.page = Math.min(S.page, pages);
        el.innerHTML = '<div class="cards">' + r.slice((S.page - 1) * S.size, S.page * S.size).map(function (c) {
          return '<button type="button" class="card ccard" data-open="' + c.id + '"><div class="cc-top"><span class="ava" style="background:' + D.hue(c.name) + '">' + D.initials(c.name) + '</span>' +
            '<span class="grow"><strong>' + c.name + '</strong><small>' + c.sector + ' · ' + c.city + '</small></span><span class="ui-badge" style="color:var(--' + ST[c.status].color + ');background:color-mix(in srgb,var(--' + ST[c.status].color + ') 14%,transparent)">' + ST[c.status].label + '</span></div>' +
            '<dl class="cc-meta"><div><dt>Contact</dt><dd>' + c.contact + '</dd></div><div><dt>Factures</dt><dd>' + c.invoices + '</dd></div><div><dt>Chiffre d\'affaires</dt><dd class="num">' + (c.revenue / 1e6).toFixed(1).replace('.', ',') + ' M FCFA</dd></div></dl></button>';
        }).join('') + '</div><div class="pager"><label>Par page <select id="size">' + [6, 12, 24].map(function (n) { return '<option' + (n === S.size ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>' +
          '<span>' + ((S.page - 1) * S.size + 1) + '–' + Math.min(S.page * S.size, r.length) + ' sur ' + r.length + '</span>' +
          '<button class="ui-btn ui-btn--icon" data-page="-1"' + (S.page <= 1 ? ' disabled' : '') + ' aria-label="Page précédente"><span class="mi">chevron_left</span></button>' +
          '<button class="ui-btn ui-btn--icon" data-page="1"' + (S.page >= pages ? ' disabled' : '') + ' aria-label="Page suivante"><span class="mi">chevron_right</span></button></div>';
      }
    }
    function render() { controls(); list(); }
    document.getElementById('ex-content').addEventListener('click', function (e) {
      var t = e.target.closest('[data-st],[data-f],[data-clear],[data-view],[data-open],[data-page]'); if (!t) return;
      if (t.dataset.st !== undefined && t.hasAttribute('data-st')) { S.status = t.dataset.st; S.page = 1; }
      if (t.dataset.f) { S[t.dataset.f] = t.dataset.v || null; S.page = 1; }
      if (t.hasAttribute('data-clear')) { S.city = S.owner = null; }
      if (t.dataset.view) S.view = t.dataset.view;
      if (t.dataset.open) return open({ id: t.dataset.open });
      if (t.dataset.page) S.page += +t.dataset.page;
      render();
    });
    document.addEventListener('change', function (e) { if (e.target.id === 'size') { S.size = +e.target.value; S.page = 1; list(); } });
    render();
  })();
  </script>
</body>
</html>

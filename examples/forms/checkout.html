<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .steps { max-width: 1100px; margin: 0 auto var(--space-6); padding: 0; list-style: none; display: flex; gap: var(--space-2); }
    .steps li { flex: 1; display: flex; align-items: center; gap: var(--space-2); padding-top: var(--space-3); border-top: 3px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .steps li.on, .steps li.done { border-color: var(--primary); color: var(--text-primary); }
    .steps .dot { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--hover-bg); font-size: 12px; }
    .steps .dot .mi { font-size: 15px; }
    .steps .on .dot, .steps .done .dot { background: var(--primary); color: var(--on-primary); }
    @media (max-width: 600px) { .steps li { font-size: 0; gap: 0; justify-content: center; } }
    .layout { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: var(--space-5); align-items: start; }
    @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } .summary { order: -1; } }
    .main { display: flex; flex-direction: column; gap: var(--space-4); }
    .prefix { font-weight: 600; color: var(--text-secondary); padding-right: var(--space-2); border-right: 1px solid var(--border); }
    .pays .c-ic.brand { color: #fff; font-size: 11px; }
    .card-fields { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--hover-bg); }
    .pay-btn { height: 52px; font-size: 16px; }
    .waiting { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); background: var(--primary-soft); }
    .waiting > .mi { font-size: 30px; color: var(--primary); animation: buzz 1.2s ease-in-out infinite; }
    .waiting span { display: flex; flex-direction: column; } .waiting small { font-size: 12.5px; color: var(--text-secondary); }
    @keyframes buzz { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-10deg); } 80% { transform: rotate(10deg); } 90% { transform: rotate(-6deg); } }
    .summary { position: sticky; top: 0; overflow: hidden; }
    .sum-toggle { display: none; }
    .sum-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
    .summary h2 { margin: 0; font-size: 18px; font-weight: 700; }
    @media (max-width: 1100px) { .summary { position: static; }
      .sum-toggle { width: 100%; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-5); border: 0; background: none; font: 600 14px var(--font-sans); color: var(--primary); cursor: pointer; }
      .sum-toggle strong { margin-left: auto; color: var(--text-primary); font-size: 16px; }
      .sum-body { display: none; padding-top: 0; } .summary.open .sum-body { display: flex; } .summary h2 { display: none; } }
    .item { display: flex; gap: var(--space-3); align-items: flex-start; }
    .item .thumb { width: 56px; height: 56px; flex: none; border-radius: var(--radius-lg); display: grid; place-items: center; background: hsl(var(--h) 24% 92%); }
    .item .thumb .mi { color: hsl(var(--h) 25% 40%); }
    [data-mode="dark"] .item .thumb { filter: brightness(.6); }
    .it-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); } .it-txt strong { font-size: 13.5px; } .it-txt small { font-size: 12px; color: var(--text-muted); }
    .it-price { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
    .it-price button { border: 0; background: none; color: var(--text-muted); cursor: pointer; padding: 0; display: flex; } .it-price button:hover { color: var(--error); }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-full); width: max-content; }
    .stepper button { width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--text-secondary); display: grid; place-items: center; }
    .stepper button:hover { background: var(--hover-bg); } .stepper .mi { font-size: 16px; }
    .stepper output { min-width: 24px; text-align: center; font-weight: 600; font-size: 13px; }
    .promo { display: flex; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }
    .promo .field-box { flex: 1; min-height: 40px; background: var(--hover-bg); } .promo .field-box input { height: 38px; }
    .promo-ok { display: flex; align-items: center; gap: var(--space-1); font-size: 12.5px; font-weight: 600; color: var(--success-text); }
    .totals { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); margin: 0; padding-top: var(--space-4); border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .totals dt { color: var(--text-secondary); } .totals dd { margin: 0; text-align: right; font-weight: 600; }
    .totals .disc { color: var(--success-text); }
    .totals .tot { padding-top: var(--space-3); border-top: 1px dashed var(--border); font-size: 18px; font-weight: 700; color: var(--text-primary); }
    .secure { display: flex; align-items: center; gap: var(--space-2); margin: 0; font-size: 12px; color: var(--text-muted); }
    .done { max-width: 640px; margin: 0 auto; }
  </style>
</head>
<body data-ex data-root="../../" data-title="Commande">
  <main id="ex-content"><div id="app"></div></main>

  <script src="../../js/lib/qr-code.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var STEPS = ['Panier', 'Livraison & paiement', 'Confirmation'];
    var items = [
      { name: 'Casque sans fil Pro', variant: 'Noir', price: 60000, qty: 1, icon: 'headphones', hue: 210 },
      { name: 'Clavier mécanique', variant: 'FR · AZERTY', price: 105000, qty: 1, icon: 'keyboard', hue: 280 },
      { name: 'Routeur Wi-Fi 6', variant: 'Bi-bande', price: 75000, qty: 2, icon: 'router', hue: 140 }
    ];
    // Panier transmis par le catalogue (examples/app/catalog.html)
    try { var c = JSON.parse(sessionStorage.getItem('ex-cart') || 'null'); if (c && c.length) items = c; } catch (e) {}
    var SHIP = [
      { id: 'std', label: 'Standard', hint: 'Livré en 48 h à Abidjan', price: 2000, icon: 'local_shipping' },
      { id: 'exp', label: 'Express', hint: 'Livré demain avant 12 h', price: 5000, icon: 'bolt' },
      { id: 'pick', label: 'Retrait en point relais', hint: 'Plateau, Cocody, Marcory', price: 0, icon: 'storefront' }
    ];
    var PAYS = [
      { id: 'orange', label: 'Orange Money', hint: 'Confirmation par USSD', mark: 'OM', color: '#ff7900' },
      { id: 'mtn', label: 'MTN MoMo', hint: 'Confirmation par SMS', mark: 'MTN', color: '#ffcc00' },
      { id: 'wave', label: 'Wave', hint: 'Sans frais', mark: 'W', color: '#1dc3ff' },
      { id: 'card', label: 'Carte bancaire', hint: 'Visa, Mastercard', mark: '💳', color: '#334155' }
    ];
    var S = { shipping: 'std', pay: 'orange', discount: 0, promoMsg: '', summaryOpen: false, state: 'form',
      m: { email: 'jean.kouassi@example.com', phone: '07 07 12 34 56', name: 'Jean Kouassi', address: 'Rue des Jardins, Cocody Deux-Plateaux', city: 'Abidjan', notes: '', momo: '07 07 12 34 56', card: '', exp: '', cvc: '' } };
    var app = document.getElementById('app');
    var nf = new Intl.NumberFormat('fr-FR');
    function n(x) { return nf.format(Math.round(x)); }
    function subtotal() { return items.reduce(function (s, i) { return s + i.price * i.qty; }, 0); }
    function count() { return items.reduce(function (s, i) { return s + i.qty; }, 0); }
    function shipPrice() { return SHIP.find(function (s) { return s.id === S.shipping; }).price; }
    function total() { return subtotal() - S.discount + shipPrice(); }
    function payLabel() { return PAYS.find(function (p) { return p.id === S.pay; }).label; }
    function field(label, name, icon, extra) {
      return '<div class="ui-field"><label class="ui-label" for="f-' + name + '">' + label + '</label><div class="field-box">' + (icon ? '<span class="mi">' + icon + '</span>' : '') +
        '<input id="f-' + name + '" name="' + name + '" value="' + (S.m[name] || '') + '" ' + (extra || '') + '></div></div>';
    }

    function stepsTpl() {
      var done = S.state === 'done';
      return '<ol class="steps" aria-label="Étapes">' + STEPS.map(function (s, i) {
        var isDone = i === 0 || done, on = (i === 1 && !done) || (i === 2 && done);
        return '<li class="' + (isDone ? 'done ' : '') + (on ? 'on' : '') + '"><span class="dot">' + (i === 0 || (done && i < 2) ? '<span class="mi">check</span>' : i + 1) + '</span>' + s + '</li>';
      }).join('') + '</ol>';
    }

    function summaryTpl() {
      return '<aside class="summary card' + (S.summaryOpen ? ' open' : '') + '">' +
        '<button type="button" class="sum-toggle" data-act="sum"><span class="mi">shopping_bag</span>' + (S.summaryOpen ? 'Masquer' : 'Afficher') + ' le récapitulatif (' + count() + ')<strong>' + n(total()) + ' F</strong></button>' +
        '<div class="sum-body"><h2>Récapitulatif</h2>' +
        (items.length ? items.map(function (it, i) {
          return '<div class="item"><span class="thumb" style="--h:' + it.hue + '"><span class="mi">' + it.icon + '</span></span>' +
            '<span class="it-txt"><strong>' + it.name + '</strong><small>' + it.variant + '</small>' +
            '<span class="stepper"><button type="button" data-qty="' + i + '" data-d="-1" aria-label="Moins"><span class="mi">remove</span></button><output>' + it.qty + '</output><button type="button" data-qty="' + i + '" data-d="1" aria-label="Plus"><span class="mi">add</span></button></span></span>' +
            '<span class="it-price">' + n(it.price * it.qty) + ' F<button type="button" data-rm="' + i + '" aria-label="Retirer"><span class="mi">delete_outline</span></button></span></div>';
        }).join('') : '<p class="muted">Votre panier est vide.</p>') +
        '<div class="promo"><div class="field-box"><span class="mi">sell</span><input id="promo" placeholder="Code promo (AKWABA10)"></div><button type="button" class="ui-btn ui-btn--outlined" data-act="promo">Appliquer</button></div>' +
        (S.promoMsg === 'ok' ? '<span class="promo-ok"><span class="mi" style="font-size:15px">check_circle</span>Code AKWABA10 : −10 %</span>' : '') +
        (S.promoMsg === 'ko' ? '<span class="err"><span class="mi">error</span>Code inconnu ou expiré.</span>' : '') +
        '<dl class="totals"><dt>Sous-total</dt><dd>' + n(subtotal()) + ' F</dd>' +
        (S.discount ? '<dt>Remise</dt><dd class="disc">− ' + n(S.discount) + ' F</dd>' : '') +
        '<dt>Livraison</dt><dd>' + (shipPrice() ? n(shipPrice()) + ' F' : 'Gratuite') + '</dd>' +
        '<dt class="tot">Total TTC</dt><dd class="tot">' + n(total()) + ' FCFA</dd></dl>' +
        '<p class="secure"><span class="mi" style="font-size:15px">verified_user</span>Paiement sécurisé · retours gratuits sous 14 jours</p></div></aside>';
    }

    function payFields() {
      if (S.pay === 'card') return '<div class="card-fields">' + field('Numéro de carte', 'card', 'credit_card', 'inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242"') +
        '<div class="row-2">' + field('Expiration', 'exp', '', 'inputmode="numeric" autocomplete="cc-exp" placeholder="MM / AA"') +
        '<div class="ui-field"><label class="ui-label" for="f-cvc">Cryptogramme</label><div class="field-box"><input id="f-cvc" name="cvc" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123"><span class="mi" title="3 chiffres au dos de la carte">help_outline</span></div></div></div></div>';
      return '<div class="ui-field"><label class="ui-label" for="f-momo">Numéro ' + payLabel() + '</label><div class="field-box"><span class="prefix">+225</span><input id="f-momo" name="momo" type="tel" value="' + S.m.momo + '"></div>' +
        '<span class="help">Vous recevrez une demande de confirmation sur ce numéro. Gardez votre téléphone à portée de main.</span></div>';
    }

    function render() {
      if (S.state === 'done') {
        app.innerHTML = stepsTpl() + '<section class="card done">' + ExW.result({ icon: 'check', title: 'Commande confirmée',
          text: 'Commande <code>CMD-2026-10482</code> · ' + n(total()) + ' FCFA payés via ' + payLabel() + '. Un SMS de suivi a été envoyé au ' + S.m.phone + '.<br><br>' + ExW.qr('https://scstorage.ci/suivi/CMD-2026-10482', 120, 'Suivi de livraison'),
          actions: '<button class="ui-btn" data-act="back">Retour à la boutique</button>' }) + '</section>';
        return;
      }
      var waiting = S.state === 'waiting';
      app.innerHTML = stepsTpl() + '<div class="layout"><form class="main" id="order" novalidate>' +
        '<section class="card section"><h2><span class="num">1</span>Coordonnées</h2><div class="row-2">' + field('E-mail', 'email', 'mail', 'type="email" autocomplete="email"') +
          '<div class="ui-field"><label class="ui-label" for="f-phone">Téléphone</label><div class="field-box"><span class="prefix">+225</span><input id="f-phone" name="phone" type="tel" value="' + S.m.phone + '" autocomplete="tel-national"></div><span class="help">Pour le livreur et le suivi par SMS.</span></div></div></section>' +
        '<section class="card section"><h2><span class="num">2</span>Livraison</h2><div class="row-2">' + field('Destinataire', 'name', 'person', 'autocomplete="name"') +
          '<div class="ui-field"><label class="ui-label" for="f-city">Ville</label><div class="field-box"><span class="mi">location_city</span><select id="f-city" name="city">' +
          ['Abidjan', 'Bouaké', 'San Pedro', 'Yamoussoukro'].map(function (c) { return '<option' + (c === S.m.city ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div></div></div>' +
          field('Adresse', 'address', 'home', 'autocomplete="street-address"') +
          '<div class="ui-field"><label class="ui-label" for="f-notes">Indications pour le livreur <span class="help">(facultatif)</span></label><div class="field-box textarea-box"><textarea id="f-notes" name="notes" rows="2" style="min-height:60px" placeholder="Portail bleu, à côté de la pharmacie…">' + S.m.notes + '</textarea></div></div>' +
          '<div class="choices" role="radiogroup" aria-label="Mode de livraison">' + SHIP.map(function (s) {
            return '<button type="button" role="radio" class="choice' + (S.shipping === s.id ? ' on' : '') + '" aria-checked="' + (S.shipping === s.id) + '" data-ship="' + s.id + '"><span class="c-ic"><span class="mi">' + s.icon + '</span></span>' +
              '<span class="c-txt"><strong>' + s.label + '</strong><small>' + s.hint + '</small><b style="margin-top:4px;font-size:13px">' + (s.price ? n(s.price) + ' FCFA' : 'Gratuit') + '</b></span><span class="mark"></span></button>';
          }).join('') + '</div></section>' +
        '<section class="card section"><h2><span class="num">3</span>Paiement</h2><div class="choices pays" role="radiogroup" aria-label="Moyen de paiement">' + PAYS.map(function (p) {
            return '<button type="button" role="radio" class="choice' + (S.pay === p.id ? ' on' : '') + '" aria-checked="' + (S.pay === p.id) + '" data-pay="' + p.id + '"><span class="c-ic brand" style="background:' + p.color + '">' + p.mark + '</span>' +
              '<span class="c-txt"><strong>' + p.label + '</strong><small>' + p.hint + '</small></span><span class="mark"></span></button>';
          }).join('') + '</div><div id="pay-fields">' + payFields() + '</div>' +
          '<label class="ui-check"><input type="checkbox" checked> Adresse de facturation identique</label>' +
          '<label class="ui-check"><input type="checkbox" checked> Enregistrer ces informations pour mes prochaines commandes</label></section>' +
        '<button class="ui-btn pay-btn" type="submit"' + (waiting || !items.length ? ' disabled' : '') + '>' + (waiting ? '<span class="spin"></span>' : 'Payer ' + n(total()) + ' FCFA') + '</button>' +
        (waiting && S.pay !== 'card' ? '<div class="waiting card"><span class="mi">smartphone</span><span><strong>Confirmez le paiement sur votre téléphone</strong><small>Saisissez votre code secret dans la fenêtre qui s\'affiche (+225 ' + S.m.momo + ').</small></span></div>' : '') +
        '</form>' + summaryTpl() + '</div>';
    }
    function save() { var f = document.getElementById('order'); if (!f) return; Array.prototype.forEach.call(f.elements, function (el) { if (el.name && el.name in S.m) S.m[el.name] = el.value; }); }
    function rerender() { save(); var y = app.closest('.ex-content').scrollTop; render(); app.closest('.ex-content').scrollTop = y; }

    app.addEventListener('click', function (e) {
      var t = e.target.closest('[data-ship],[data-pay],[data-qty],[data-rm],[data-act]');
      if (!t) return;
      if (t.dataset.ship) S.shipping = t.dataset.ship;
      if (t.dataset.pay) S.pay = t.dataset.pay;
      if (t.dataset.qty) { var it = items[+t.dataset.qty]; it.qty = Math.max(0, Math.min(9, it.qty + +t.dataset.d)); items = items.filter(function (x) { return x.qty > 0; }); }
      if (t.dataset.rm) items.splice(+t.dataset.rm, 1);
      if (t.dataset.act === 'sum') S.summaryOpen = !S.summaryOpen;
      if (t.dataset.act === 'promo') {
        var code = document.getElementById('promo').value.trim().toUpperCase();
        if (code === 'AKWABA10') { S.discount = Math.round(subtotal() * 0.1); S.promoMsg = 'ok'; } else { S.discount = 0; S.promoMsg = 'ko'; }
      }
      if (t.dataset.act === 'back') { S.state = 'form'; }
      if (S.promoMsg === 'ok') S.discount = Math.round(subtotal() * 0.1);
      rerender();
    });
    app.addEventListener('keydown', function (e) { if (e.target.id === 'promo' && e.key === 'Enter') { e.preventDefault(); app.querySelector('[data-act=promo]').click(); } });
    // Formatage à la saisie : 4242 4242 4242 4242 et MM / AA
    app.addEventListener('input', function (e) {
      var t = e.target;
      if (t.name === 'card') t.value = t.value.replace(/\D/g, '').slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
      if (t.name === 'exp') { var d = t.value.replace(/\D/g, '').slice(0, 4); t.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d; }
    });
    app.addEventListener('submit', function (e) {
      e.preventDefault(); save(); S.state = 'waiting'; render();
      setTimeout(function () { S.state = 'done'; try { sessionStorage.removeItem('ex-cart'); } catch (x) {} render(); }, S.pay === 'card' ? 1200 : 2600);
    });
    render();
  })();
  </script>
</body>
</html>

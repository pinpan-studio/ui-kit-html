<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichiers</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/media.css">
  <link rel="stylesheet" href="../../css/files.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .layout-switch { display: inline-flex; padding: 3px; border-radius: var(--radius-md); background: var(--hover-bg); }
    .layout-switch a { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; white-space: nowrap; border-radius: var(--radius-sm); font: 500 13px var(--font-sans); color: var(--text-secondary); text-decoration: none; }
    .layout-switch .mi { font-size: 18px; } .layout-switch a.on { background: var(--card-bg); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-1); }
    .layout { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: var(--space-6); align-items: start; } .layout.with-details { grid-template-columns: 216px minmax(0, 1fr) 300px; }
    @media (max-width: 1100px) { .layout, .layout.with-details { grid-template-columns: minmax(0, 1fr); } }
    .places-col { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--space-5); }
    .places-col nav { display: flex; flex-direction: column; gap: 2px; }
    .places-col nav button { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: none; cursor: pointer; text-align: left; font: 500 14px var(--font-sans); color: var(--text-secondary); }
    .places-col nav .mi { font-size: 20px; } .places-col nav span { flex: 1; } .places-col nav b { font-size: 12px; } .places-col nav button:hover { background: var(--hover-bg); } .places-col nav button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
    @media (max-width: 1100px) { .places-col { position: static; } .places-col nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; } .places-col nav button { flex: none; } .storage { display: none; } }
    .storage { padding: 16px; border-radius: var(--radius-md); background: var(--hover-bg); }
    .s-top { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; } .s-top span { color: var(--text-muted); }
    .storage .bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); } .storage .bar i { display: block; min-width: 3px; }
    .storage ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .storage li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); } .storage li i { width: 8px; height: 8px; border-radius: 2px; } .storage li span { margin-left: auto; color: var(--text-muted); }
    .storage .more { width: 100%; margin-top: 16px; }
    .main { padding: 16px 20px 20px; min-height: 420px; } @media (max-width: 767px) { .main { padding: 12px; } }
    .bulk { display: flex; align-items: center; gap: 4px; margin: -16px -20px 16px; padding: 4px 12px 4px 8px; border-radius: var(--radius-md) var(--radius-md) 0 0; background: var(--primary-soft); }
    .bulk strong { font-size: 13px; } @media (max-width: 767px) { .bulk { margin: -12px -12px 12px; } .bulk .lbl { display: none; } }
    .details { position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; padding: 12px 16px 20px; }
    .details header { display: flex; align-items: center; justify-content: space-between; }
    .d-thumb { aspect-ratio: 4 / 3; border-radius: var(--radius-md); overflow: hidden; display: grid; place-items: center; background: var(--hover-bg); }
    .d-thumb img { width: 100%; height: 100%; object-fit: cover; } .d-thumb img.ic { width: 64px; height: 64px; object-fit: contain; } .d-thumb .mi { font-size: 72px; }
    .details h2 { margin: 0; font-size: var(--text-lg); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; } .d-actions .ui-btn { flex: 1; }
    .details .lbl { display: block; margin-bottom: 8px; font: 600 11px/1.4 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .people { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12px; }
    .d-activity p { margin: 0 0 8px; font-size: 13px; line-height: 1.45; color: var(--text-secondary); } .d-activity strong { color: var(--text-primary); }
    @media (max-width: 1100px) { .details { position: static; } }
  </style>
</head>
<body data-ex data-root="../../" data-title="Fichiers" data-crumb="Ressources">
  <main id="ex-content">
    <div class="page-head">
      <div class="titles"><span class="eyebrow">Ressources</span><h1>Fichiers</h1><p id="sub"></p></div>
      <div class="actions">
        <div class="layout-switch" role="group" aria-label="Disposition"><a class="on" aria-current="page"><span class="mi">grid_view</span>Grille</a><a href="files-columns.html"><span class="mi">view_week</span>Colonnes</a></div>
        <button class="ui-btn ui-btn--outlined" id="pick"><span class="mi">file_open</span>Sélecteur (modale)</button>
        <details class="ui-menu"><summary class="ui-btn"><span class="mi">add</span>Nouveau</summary><div class="ui-menu__panel">
          <button class="ui-menu__item" id="new-folder"><span class="mi">create_new_folder</span>Nouveau dossier</button><hr>
          <button class="ui-menu__item" id="upload"><span class="mi">upload_file</span>Importer des fichiers</button></div></details>
        <input type="file" id="input" multiple hidden>
      </div>
    </div>
    <div class="layout" id="layout">
      <aside class="places-col"><nav aria-label="Emplacements" id="places"></nav>
        <section class="storage" aria-label="Stockage" id="storage"></section></aside>
      <section class="main card"><div id="bulk"></div><div id="browser"></div></section>
      <aside class="details card" aria-label="Détails" id="details" hidden></aside>
    </div>
  </main>

  <script src="../../js/data/media.js"></script>
  <script src="../../js/media.js"></script>
  <script src="../../js/files.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); }, esc = UIComp.esc;
    Files.ensure();
    var S = { scope: 'drive', folder: null, sel: [] };
    var PLACES = [['drive', 'Mon disque', 'cloud'], ['recent', 'Récents', 'schedule'], ['starred', 'Favoris', 'star_border'], ['shared', 'Partagés', 'group']];
    var br = Files.browser($('browser'), { scope: 'drive', view: innerWidth < 768 ? 'list' : 'card',
      onSelection: function (l) { S.sel = l; side(); }, onFolder: function (f) { S.folder = f; }, onOpen: preview, onAction: act, onDrop: upload });
    function side() {
      var files = Files.items.filter(function (i) { return i.kind !== 'folder'; }).length, used = Files.used();
      $('sub').textContent = files + ' fichiers · ' + Files.size(used) + ' utilisés sur ' + Files.size(Files.quota);
      $('places').innerHTML = PLACES.map(function (p) {
        var n = p[0] === 'starred' ? Files.items.filter(function (i) { return i.starred; }).length : p[0] === 'shared' ? Files.items.filter(function (i) { return i.shared; }).length : 0;
        return '<button type="button" class="' + (S.scope === p[0] ? 'on' : '') + '" data-scope="' + p[0] + '"><span class="mi">' + p[2] + '</span><span>' + p[1] + '</span>' + (n ? '<b>' + n + '</b>' : '') + '</button>'; }).join('');
      var u = Files.usageByKind();
      $('storage').innerHTML = '<div class="s-top"><strong>Stockage</strong><span>' + Math.round(used / Files.quota * 100) + ' %</span></div><div class="bar">' + u.map(function (x) { return '<i style="width:' + (x.bytes / Files.quota * 100) + '%;background:' + x.color + '" title="' + x.label + ' · ' + Files.size(x.bytes) + '"></i>'; }).join('') + '</div>' +
        '<ul>' + u.map(function (x) { return '<li><i style="background:' + x.color + '"></i>' + x.label + '<span>' + Files.size(x.bytes) + '</span></li>'; }).join('') + '</ul><button class="ui-btn ui-btn--outlined ui-btn--sm more">Augmenter l\'espace</button>';
      $('bulk').innerHTML = S.sel.length > 1 ? '<div class="bulk"><button class="ui-btn ui-btn--icon" data-clear aria-label="Désélectionner"><span class="mi">close</span></button><strong>' + S.sel.length + ' sélectionné(s)</strong><span class="spacer"></span>' +
        '<button class="ui-btn ui-btn--text ui-btn--sm" data-act="download"><span class="mi">download</span><span class="lbl">Télécharger</span></button><button class="ui-btn ui-btn--text ui-btn--sm" data-act="share"><span class="mi">person_add</span><span class="lbl">Partager</span></button>' +
        '<button class="ui-btn ui-btn--text ui-btn--sm" style="color:var(--error-text)" data-act="delete"><span class="mi">delete</span><span class="lbl">Supprimer</span></button></div>' : '';
      var f = S.sel.length === 1 ? Files.get(S.sel[0].id) : null, d = $('details');
      $('layout').classList.toggle('with-details', !!f); d.hidden = !f;
      if (!f) return;
      var where = Files.path(f.parent).map(function (p) { return p.name; }).join(' / ') || 'Mon disque', st = f.kind === 'folder' ? Files.folderStats(f.id) : null;
      var who = f.shared ? [[f.owner, '#0f766e'], ['Fatou Diabaté', '#7c3aed'], ['Marc Yao', '#059669'], ['Aya Koné', '#b45309']] : [[f.owner, '#0f766e']];
      d.innerHTML = '<header><strong>Détails</strong><button class="ui-btn ui-btn--icon" data-clear aria-label="Fermer les détails"><span class="mi">close</span></button></header>' +
        '<div class="d-thumb">' + (f.kind === 'folder' ? '<span class="mi" style="color:' + f.color + '">folder</span>' : Files.thumb(f)) + '</div><h2 title="' + esc(f.name) + '">' + esc(f.name) + '</h2>' +
        '<div class="d-actions">' + (f.kind !== 'folder' ? '<button class="ui-btn ui-btn--sm" data-act="open"><span class="mi">visibility</span>Aperçu</button>' : '') + '<button class="ui-btn ui-btn--outlined ui-btn--sm" data-act="star"><span class="mi">' + (f.starred ? 'star' : 'star_border') + '</span>' + (f.starred ? 'Favori' : 'Ajouter') + '</button></div>' +
        UIComp.descList([{ label: 'Type', value: Files.KINDS[f.kind].label + (f.mime ? ' (' + f.mime + ')' : '') }, { label: 'Taille', value: st ? Files.size(st.size) + ' · ' + st.count + ' élément(s)' : Files.size(f.size) },
          { label: 'Emplacement', value: where }, { label: 'Propriétaire', value: f.owner }, { label: 'Modifié', value: f.modified.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) }], 1, 'horizontal') +
        '<div><span class="lbl">Lien de partage</span>' + UIComp.copyField('https://scstorage.ci/f/' + f.id + '-7Hk2', 'link', 'le lien') +
        '<div class="people"><span class="ava-stack">' + who.map(function (p) { return '<span class="ava sm" style="background:' + p[1] + '" title="' + p[0] + '">' + p[0].split(' ').map(function (x) { return x[0]; }).join('').slice(0, 2) + '</span>'; }).join('') + '</span><span class="muted">' + (f.shared ? 'Partagé avec 3 personnes' : 'Privé') + '</span></div></div>' +
        '<div class="d-activity"><span class="lbl">Activité</span><p><strong>' + esc(f.owner) + '</strong> a ' + (f.kind === 'folder' ? 'créé ce dossier' : 'importé ce fichier') + ' · ' + f.modified.toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</p>' +
        (f.shared ? '<p><strong>Fatou Diabaté</strong> a consulté · hier</p>' : '') + '</div>';
    }
    function preview(f) {
      if (!f.url) return UIKit.toast('Aperçu indisponible pour « ' + f.name + ' » (exemple statique)');
      var sib = Files.items.filter(function (i) { return i.parent === f.parent && i.kind !== 'folder' && i.url; });
      Media.viewer(Files.toViewer(sib), Math.max(0, sib.findIndex(function (s) { return s.id === f.id; })));
    }
    function upload(list) { var added = Files.addFiles(list, S.scope === 'drive' ? S.folder : null); setScope('drive', S.folder); UIKit.toast(added.length + ' fichier(s) importé(s)'); }
    function setScope(sc, folder) { S.scope = sc; S.folder = folder === undefined ? null : folder; br.set({ scope: sc, folder: S.folder }); S.sel = []; side(); }
    function act(id, items) {
      if (!items.length) return; var one = items[0];
      if (id === 'open') one.kind === 'folder' ? setScope('drive', one.id) : preview(one);
      if (id === 'star') { var on = !one.starred; items.forEach(function (i) { Files.patch(i.id, { starred: on }); }); }
      if (id === 'rename') UIKit.prompt({ title: 'Renommer', label: 'Nouveau nom', value: one.name, confirm: 'Renommer', icon: 'drive_file_rename_outline' }).then(function (n) { if (n) Files.patch(one.id, { name: n }); });
      if (id === 'share') { items.forEach(function (i) { Files.patch(i.id, { shared: true }); }); UIKit.toast('Lien de partage copié'); }
      if (id === 'download') { var ok = items.filter(function (i) { return i.url; }); ok.forEach(function (f) { var a = document.createElement('a'); a.href = f.url; a.download = f.name; a.click(); }); if (ok.length < items.length) UIKit.toast('Certains éléments ne sont pas téléchargeables (exemple statique)'); }
      if (id === 'delete') UIKit.confirm({ title: items.length > 1 ? 'Supprimer ' + items.length + ' éléments ?' : 'Supprimer « ' + one.name + ' » ?', message: 'Les éléments seront placés dans la corbeille pendant 30 jours. Le contenu des dossiers est supprimé avec eux.', confirmLabel: 'Supprimer', type: 'danger' })
        .then(function (yes) { if (yes) { Files.remove(items.map(function (i) { return i.id; })); br.clear(); UIKit.toast(items.length + ' élément(s) supprimé(s)'); } });
      side();
    }
    function pickDemo() { Files.pick({ title: 'Joindre des fichiers', confirmLabel: 'Joindre' }).then(function (f) { if (f && f.length) UIKit.toast('Sélection : ' + f.map(function (x) { return x.name; }).slice(0, 2).join(', ') + (f.length > 2 ? ' et ' + (f.length - 2) + ' autre(s)' : '')); }); }
    document.getElementById('ex-content').addEventListener('click', function (e) {
      var t = e.target.closest('[data-scope],[data-clear],[data-act],#pick,#new-folder,#upload'); if (!t) return;
      var dd = t.closest('details'); if (dd) dd.removeAttribute('open');
      if (t.dataset.scope) setScope(t.dataset.scope);
      if (t.hasAttribute('data-clear')) br.clear();
      if (t.dataset.act) act(t.dataset.act, S.sel.map(function (s) { return Files.get(s.id); }));
      if (t.id === 'pick') pickDemo();
      if (t.id === 'upload') $('input').click();
      if (t.id === 'new-folder') UIKit.prompt({ title: 'Nouveau dossier', label: 'Nom du dossier', value: 'Nouveau dossier', confirm: 'Créer', icon: 'create_new_folder' }).then(function (n) { if (n) { var cur = S.scope === 'drive' ? S.folder : null; Files.createFolder(n, cur); setScope('drive', cur); } });
    });
    $('input').addEventListener('change', function (e) { upload(e.target.files); e.target.value = ''; });
    Files.on(side);
    side();
    if (new URLSearchParams(location.search).has('picker')) setTimeout(pickDemo, 50);
  })();
  </script>
</body>
</html>

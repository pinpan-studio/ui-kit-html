<!doctype html>
<html lang="fr" data-mode="system" class="theme-cyan">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichiers — colonnes</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/themes.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/media.css">
  <link rel="stylesheet" href="../../css/pages/ex.css">
  <script src="../../js/ui-kit.js"></script>
  <style>
    .wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 24px 16px 8px; }
    @media (max-width: 959px) { .wrap { padding: 8px 12px 12px; } }
    .page-head { flex: none; margin-bottom: 16px; }
    .layout-switch { display: inline-flex; padding: 3px; border-radius: var(--radius-md); background: var(--hover-bg); }
    .layout-switch a { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; white-space: nowrap; border-radius: var(--radius-sm); font: 500 13px var(--font-sans); color: var(--text-secondary); text-decoration: none; }
    .layout-switch .mi { font-size: 18px; } .layout-switch a.on { background: var(--card-bg); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-1); }
    .explorer { flex: 1; min-height: 360px; display: flex; flex-direction: column; overflow: hidden; outline: none; } .explorer:focus-visible { box-shadow: 0 0 0 2px var(--primary); }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
    .path { display: flex; align-items: center; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .path button { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; border: 0; border-radius: var(--radius-sm); background: none; cursor: pointer; font: 500 13px var(--font-sans); color: var(--text-secondary); white-space: nowrap; }
    .path .mi { font-size: 18px; } .path button:hover { background: var(--hover-bg); } .path button:last-child { color: var(--text-primary); font-weight: 600; } .path .sep { font-size: 16px; color: var(--text-muted); }
    .bar .searchbox { width: 220px; height: 34px; } @media (max-width: 767px) { .bar .searchbox { width: 140px; } }
    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
    @media (max-width: 1100px) { .body { grid-template-columns: minmax(0, 1fr) 260px; } } @media (max-width: 767px) { .body { grid-template-columns: minmax(0, 1fr); } .preview { display: none; } }
    .columns { display: flex; min-width: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; }
    .col { flex: 0 0 240px; display: flex; flex-direction: column; gap: 1px; padding: 8px; overflow-y: auto; border-right: 1px solid color-mix(in srgb, var(--border) 55%, transparent); scroll-snap-align: start; }
    .col.results { flex-basis: 100%; } @media (max-width: 767px) { .col { flex-basis: 200px; } }
    .col-head { padding: 8px; font: 600 11px/1.4 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
    .row { display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 4px 8px; border: 0; border-radius: var(--radius-sm); background: none; cursor: pointer; text-align: left; font: 13px var(--font-sans); color: var(--text-primary); user-select: none; }
    .row .fi { font-size: 20px; } .row .ic { width: 20px; height: 20px; object-fit: contain; flex: none; } .row .th { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; flex: none; }
    .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row .nm small { display: block; font-size: 12px; color: var(--text-muted); }
    .row .star { font-size: 14px; color: var(--warning); } .row .chev { font-size: 18px; color: var(--text-muted); }
    .row:hover { background: var(--hover-bg); } .row.sel { background: var(--hover-bg); font-weight: 500; }
    .row.focus { background: var(--primary); color: var(--on-primary); } .row.focus .chev, .row.focus .star, .row.focus .nm small { color: inherit; }
    .none { margin: 12px 8px; font-size: 12px; color: var(--text-muted); }
    .preview { min-height: 0; overflow-y: auto; padding: 16px; background: var(--table-header-bg); }
    .preview h2 { margin: 16px 0 2px; font-size: var(--text-lg); font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; } .pv-kind { font-size: 12px; color: var(--text-muted); }
    .preview dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 16px 0; padding-top: 16px; font-size: 13px; } .preview dt { color: var(--text-muted); } .preview dd { margin: 0; text-align: right; overflow-wrap: anywhere; } .preview .mono { font: 12px var(--font-mono); }
    .pv-actions { display: flex; gap: 8px; } .pv-actions .ui-btn:first-child { flex: 1; }
    .pv-media { border-radius: var(--radius-md); overflow: hidden; background: var(--hover-bg); } .pv-media > img { display: block; width: 100%; max-height: 240px; object-fit: contain; background: #0f172a; cursor: zoom-in; }
    .pv-media .ap { border: 0; box-shadow: none; padding: 8px; } .pv-media .vp { border-radius: 0; }
    .pv-text { margin: 0; max-height: 220px; overflow: auto; padding: 12px; font: 12px/1.6 var(--font-mono); white-space: pre-wrap; color: var(--text-secondary); }
    .pv-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; aspect-ratio: 4 / 3; cursor: pointer; } .pv-icon img { width: 72px; height: 72px; object-fit: contain; } .pv-icon span { font-size: 12px; color: var(--text-muted); }
    .pv-folder { display: grid; place-items: center; aspect-ratio: 4 / 3; border-radius: var(--radius-md); background: var(--hover-bg); } .pv-folder .mi { font-size: 80px; }
    .pv-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--text-muted); } .pv-empty .mi { font-size: 40px; } .pv-empty p { margin: 0; font-size: 13px; } .pv-empty small { font-size: 12px; }
    .status { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 12px; font-size: 12px; color: var(--text-muted); }
    .quota { width: 100px; height: 6px; border-radius: 3px; background: var(--hover-bg); overflow: hidden; } .quota i { display: block; height: 100%; background: var(--primary); }
  </style>
</head>
<body data-ex data-root="../../" data-title="Fichiers" data-crumb="Ressources" data-flush>
  <main id="ex-content"><div class="wrap">
    <div class="page-head">
      <div class="titles"><span class="eyebrow">Ressources</span><h1>Fichiers</h1><p id="sub"></p></div>
      <div class="actions"><div class="layout-switch" role="group" aria-label="Disposition"><a href="files.html"><span class="mi">grid_view</span>Grille</a><a class="on" aria-current="page"><span class="mi">view_week</span>Colonnes</a></div>
        <button class="ui-btn ui-btn--outlined" id="new-folder"><span class="mi">create_new_folder</span>Dossier</button><button class="ui-btn" id="upload"><span class="mi">upload</span>Importer</button><input type="file" id="input" multiple hidden></div>
    </div>
    <section class="card explorer" tabindex="0" id="explorer" aria-label="Explorateur de fichiers">
      <div class="bar"><nav class="path" aria-label="Emplacement" id="path"></nav><span class="spacer"></span><label class="searchbox"><span class="mi">search</span><input type="search" id="q" placeholder="Rechercher" aria-label="Rechercher"></label></div>
      <div class="body"><div class="columns" id="cols"></div><aside class="preview" aria-label="Aperçu" id="preview"></aside></div>
      <footer class="status"><span id="status"></span><span class="spacer"></span><span class="quota"><i id="quota"></i></span><span id="pct"></span></footer>
    </section>
  </div></main>

  <script src="../../js/data/media.js"></script>
  <script src="../../js/media.js"></script>
  <script src="../../js/files.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/ex-widgets.js"></script>
  <script src="../../js/ex-shell.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); }, esc = UIComp.esc;
    Files.ensure();
    var S = { trail: ['docs', 'contracts'], focus: 1, q: '' }, player, lastPv = null;
    function sorted(l) { return l.slice().sort(function (a, b) { return (a.kind === 'folder') !== (b.kind === 'folder') ? (a.kind === 'folder' ? -1 : 1) : a.name.localeCompare(b.name, 'fr'); }); }
    function columns() {
      var cols = [{ parent: null, items: sorted(Files.children(null)), selected: S.trail[0] || null }];
      S.trail.forEach(function (id, i) { var it = Files.get(id); if (it && it.kind === 'folder') cols.push({ parent: id, items: sorted(Files.children(id)), selected: S.trail[i + 1] || null }); });
      return cols;
    }
    function selected() { return Files.get(S.trail[S.trail.length - 1]) || null; }
    function where(f) { return ['Mon disque'].concat(Files.path(f.parent).map(function (p) { return p.name; })).join(' / '); }
    function icon(f) { return '../../assets/icons-files/' + Files.KINDS[f.kind].img; }
    function row(f, cls) {
      return (f.kind === 'folder' ? '<span class="mi fi" style="color:' + f.color + '">folder</span>' : f.kind === 'image' && f.url ? '<img class="th" src="' + f.url + '" alt="">' : '<img class="ic" src="' + icon(f) + '" alt="">');
    }
    function render() {
      var used = Files.used(), pct = Math.round(used / Files.quota * 100), cols = columns(), s = selected();
      $('sub').textContent = 'Explorateur en colonnes · ' + Files.size(used) + ' utilisés sur ' + Files.size(Files.quota);
      $('path').innerHTML = '<button type="button" data-root><span class="mi">cloud</span>Mon disque</button>' + S.trail.map(function (id) { var p = Files.get(id); return p ? '<span class="mi sep">chevron_right</span><button type="button" data-reveal="' + id + '">' + esc(p.name) + '</button>' : ''; }).join('');
      if (S.q) {
        var q = S.q.trim().toLowerCase(), res = Files.items.filter(function (i) { return i.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 40);
        $('cols').innerHTML = '<div class="col results"><div class="col-head">' + res.length + ' résultat(s)</div>' + (res.length ? res.map(function (f) { return '<button type="button" class="row" data-reveal="' + f.id + '">' + row(f) + '<span class="nm">' + esc(f.name) + '<small>' + esc(where(f)) + '</small></span></button>'; }).join('') : '<p class="none">Aucun fichier ne correspond.</p>') + '</div>';
      } else {
        $('cols').innerHTML = cols.map(function (c, ci) {
          return '<div class="col' + (ci === S.focus ? ' active' : '') + '">' + (c.items.length ? c.items.map(function (f) {
            return '<button type="button" class="row' + (c.selected === f.id ? ' sel' : '') + (c.selected === f.id && ci === S.focus ? ' focus' : '') + '" data-ci="' + ci + '" data-id="' + f.id + '">' + row(f) + '<span class="nm">' + esc(f.name) + '</span>' +
              (f.starred ? '<span class="mi star">star</span>' : '') + (f.kind === 'folder' ? '<span class="mi chev">chevron_right</span>' : '') + '</button>'; }).join('') : '<p class="none">Dossier vide</p>') + '</div>';
        }).join('');
        requestAnimationFrame(function () { $('cols').scrollTo({ left: $('cols').scrollWidth, behavior: 'smooth' }); });
      }
      var last = cols[cols.length - 1];
      $('status').textContent = last.items.length + ' élément(s)' + (s ? ' · « ' + s.name + ' » sélectionné' + (s.kind === 'folder' ? '' : ' · ' + Files.size(s.size)) : '');
      $('quota').style.width = pct + '%'; $('pct').textContent = pct + ' % utilisés';
      preview(s);
    }
    function preview(s) {
      if (s === lastPv && s) return; lastPv = s;
      if (player && player.audio) player.audio.pause();
      var el = $('preview');
      if (!s) { el.innerHTML = '<div class="pv-empty"><span class="mi">preview</span><p>Sélectionnez un fichier pour l\'aperçu.</p><small><span class="kbd">↑</span> <span class="kbd">↓</span> parcourir · <span class="kbd">→</span> ouvrir · <span class="kbd">Espace</span> plein écran</small></div>'; return; }
      if (s.kind === 'folder') { var st = Files.folderStats(s.id);
        el.innerHTML = '<div class="pv-folder"><span class="mi" style="color:' + s.color + '">folder</span></div><h2>' + esc(s.name) + '</h2><span class="pv-kind">Dossier · ' + st.count + ' élément(s) · ' + Files.size(st.size) + '</span>' +
          '<dl><dt>Propriétaire</dt><dd>' + esc(s.owner) + '</dd><dt>Modifié</dt><dd>' + s.modified.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) + '</dd><dt>Partage</dt><dd>' + (s.shared ? 'Partagé' : 'Privé') + '</dd></dl>'; return; }
      var media = s.kind === 'image' ? '<img src="' + s.url + '" alt="' + esc(s.name) + '" data-open>' : s.kind === 'video' || s.kind === 'audio' ? '<div id="pv-player"></div>' : s.kind === 'text' ? '<pre class="pv-text">…</pre>'
        : '<div class="pv-icon"' + (s.url ? ' data-open' : '') + '><img src="' + icon(s) + '" alt="">' + (s.kind === 'pdf' ? '<span>Cliquez pour ouvrir le PDF</span>' : '') + '</div>';
      el.innerHTML = '<div class="pv-media">' + media + '</div><h2 title="' + esc(s.name) + '">' + esc(s.name) + '</h2><span class="pv-kind">' + Files.KINDS[s.kind].label + ' · ' + Files.size(s.size) + '</span>' +
        '<dl><dt>Emplacement</dt><dd>' + esc(where(s)) + '</dd><dt>Propriétaire</dt><dd>' + esc(s.owner) + '</dd><dt>Modifié</dt><dd>' + s.modified.toLocaleString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + '</dd>' +
        (s.mime ? '<dt>Format</dt><dd class="mono">' + s.mime + '</dd>' : '') + '<dt>Partage</dt><dd>' + (s.shared ? 'Partagé (4 personnes)' : 'Privé') + '</dd></dl>' +
        '<div class="pv-actions"><button class="ui-btn" data-open' + (s.url ? '' : ' disabled') + '><span class="mi">open_in_full</span>Ouvrir</button><button class="ui-btn ui-btn--outlined" data-star aria-label="Favori"><span class="mi">' + (s.starred ? 'star' : 'star_border') + '</span></button>' +
        '<button class="ui-btn ui-btn--outlined" data-rename aria-label="Renommer"><span class="mi">drive_file_rename_outline</span></button></div>';
      if (s.kind === 'video') player = Media.video($('pv-player'), { src: s.url });
      if (s.kind === 'audio') player = Media.audio($('pv-player'), { tracks: [{ title: s.name, src: s.url, blob: s.blob }] });
      if (s.kind === 'text' && s.blob) s.blob.text().then(function (t) { var p = el.querySelector('.pv-text'); if (p) p.textContent = t; });
    }
    function selectAt(ci, id) { S.trail = id ? S.trail.slice(0, ci).concat(id) : S.trail.slice(0, Math.max(0, ci)); S.focus = Math.max(0, ci); render(); $('explorer').focus({ preventScroll: true }); }
    function reveal(f) { S.trail = Files.path(f.parent).map(function (p) { return p.id; }).concat(f.id); S.q = ''; $('q').value = ''; S.focus = S.trail.length - 1; lastPv = null; render(); }
    function open(f) { if (!f.url) return UIKit.toast('Aperçu indisponible (exemple statique)'); var sib = Files.children(f.parent).filter(function (i) { return i.kind !== 'folder' && i.url; }); Media.viewer(Files.toViewer(sib), sib.findIndex(function (x) { return x.id === f.id; })); }
    function curFolder() { var s = selected(); return s ? (s.kind === 'folder' ? s.id : s.parent) : null; }
    function upload(list) { var a = Files.addFiles(list, curFolder()); if (a[0]) reveal(a[0]); UIKit.toast(a.length + ' fichier(s) importé(s)'); }
    document.getElementById('ex-content').addEventListener('click', function (e) {
      var t = e.target.closest('[data-root],[data-reveal],[data-id],[data-open],[data-star],[data-rename],#new-folder,#upload'); if (!t) return;
      if (t.hasAttribute('data-root')) selectAt(-1, null);
      if (t.dataset.reveal) reveal(Files.get(t.dataset.reveal));
      if (t.dataset.id) selectAt(+t.dataset.ci, t.dataset.id);
      var s = selected();
      if (t.hasAttribute('data-open') && s) open(s);
      if (t.hasAttribute('data-star') && s) { Files.patch(s.id, { starred: !s.starred }); lastPv = null; render(); }
      if (t.hasAttribute('data-rename') && s) UIKit.prompt({ title: 'Renommer', label: 'Nouveau nom', value: s.name, confirm: 'Renommer', icon: 'drive_file_rename_outline' }).then(function (n) { if (n) { Files.patch(s.id, { name: n }); lastPv = null; render(); } });
      if (t.id === 'upload') $('input').click();
      if (t.id === 'new-folder') { var parent = curFolder(); UIKit.prompt({ title: 'Nouveau dossier', label: 'Nom du dossier', value: 'Nouveau dossier', confirm: 'Créer', icon: 'create_new_folder' }).then(function (n) { if (n) reveal(Files.createFolder(n, parent)); }); }
    });
    $('cols').addEventListener('dblclick', function (e) { var t = e.target.closest('[data-id]'); if (t) { var f = Files.get(t.dataset.id); if (f.kind !== 'folder') open(f); } });
    $('explorer').addEventListener('keydown', function (e) {
      if (e.target.closest('input, .vp, .ap')) return;
      var cols = columns(), ci = Math.min(S.focus, cols.length - 1), col = cols[ci], idx = col.items.findIndex(function (i) { return i.id === col.selected; });
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); var n = col.items[Math.min(col.items.length - 1, Math.max(0, idx + (e.key === 'ArrowDown' ? 1 : -1)))]; if (n) selectAt(ci, n.id); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); var nc = cols[ci + 1]; if (nc && nc.items.length) selectAt(ci + 1, nc.items[0].id); }
      else if (e.key === 'ArrowLeft' && ci > 0) { e.preventDefault(); S.trail = S.trail.slice(0, ci); S.focus = ci - 1; render(); }
      else if ((e.key === 'Enter' || e.key === ' ') && selected() && selected().kind !== 'folder') { e.preventDefault(); open(selected()); }
    });
    $('explorer').addEventListener('dragover', function (e) { e.preventDefault(); });
    $('explorer').addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });
    $('q').addEventListener('input', function (e) { S.q = e.target.value; render(); });
    $('input').addEventListener('change', function (e) { upload(e.target.files); e.target.value = ''; });
    Files.on(function () { lastPv = null; render(); });
    render();
  })();
  </script>
</body>
</html>
